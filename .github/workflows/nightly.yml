name: Nightly

on:
  schedule:
    # Run daily at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      accept_baseline:
        description: 'Startup guard: pass even if slower, so this build becomes the baseline'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      TARGET: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free disk space (Ubuntu)
        # SHA-pinned to defend against upstream takeover; bump deliberately.
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Set up the build
        uses: ./.github/actions/setup
        with:
          apt: pkg-config python3-dev
          cache-key: nightly
          pip-cache: |
            scripts/requirements.txt
            scripts/requirements-fixtures.txt
            scripts/requirements-wheel.txt
            scripts/requirements-wheel-windows.txt
            scripts/requirements-release.txt
            python/pyproject.toml

      - name: Install zig, cargo-zigbuild and maturin
        run: pip install -r scripts/requirements-release.txt

      # As release.yml builds it: linked by zig against glibc 2.28, then placed
      # where the packagers and the startup guard read it.
      - name: Build release binary against glibc 2.28
        run: cargo zigbuild --release --locked -p datui --target "$TARGET.2.28"

      - name: Place the binary where the packagers read it
        run: install -D "target/$TARGET/release/datui" target/release/datui

      - name: Verify release artifacts
        run: test -f target/release/datui || (echo "Release binary not found" && exit 1)

      - name: Install cargo packaging tools
        uses: ./.github/actions/install-tools
        with:
          tools: cargo-deb cargo-generate-rpm

      - name: Build deb package
        run: python3 scripts/packaging/build_package.py deb --no-build

      - name: Build rpm package
        run: python3 scripts/packaging/build_package.py rpm --no-build

      - name: Build tarball and AUR PKGBUILD
        run: python3 scripts/packaging/build_package.py aur --no-build

      - name: Bundle CLI for wheel
        run: |
          mkdir -p python/datui_bin
          cp target/release/datui python/datui_bin/
          chmod +x python/datui_bin/datui
          cp LICENSE python/LICENSE

      - name: Build Python wheel (manylinux_2_28)
        run: |
          python3 scripts/packaging/wheel_manpages.py
          cd python && maturin build --release --out dist --target "$TARGET" --zig --manylinux 2_28

      - name: Upload packaging artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-linux
          path: |
            target/debian/*.deb
            target/generate-rpm/*.rpm
            target/tarball/*.tar.gz
            target/aur/PKGBUILD
            python/dist/*.whl
            target/release/datui
            target/dist/man
            target/dist/completions

  # Time to first rows and peak memory on generated files, tonight's build against
  # the last build that passed this check (scripts/bench/startup.py guard). Both run
  # on this runner, interleaved, so the runner's speed cancels out. It fails only at
  # twice the baseline's median and past an absolute floor, so noise cannot trip it.
  # The baseline is the last passing night rather than the release: a release can be
  # far slower than main (0.3.2 took 30 times as long to first rows), which would hide
  # a doubling until the next one. A failing night is never a baseline, so a
  # regression keeps failing until it is fixed. An intended one is accepted by
  # running Nightly by hand on main with `accept_baseline`: it measures as usual,
  # passes, and so becomes the next baseline; its log says it was accepted by hand.
  # Nightly rather than on pull requests: it needs a release build.
  startup-guard:
    name: Startup guard
    needs: linux
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read  # the checkout and the release fallback
      actions: read  # earlier Nightly runs, their jobs and their artifacts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The fixture generator, which the benchmark's data comes from.
      - name: Set up the build
        uses: ./.github/actions/setup
        with:
          rust: false
          apt: ''
          pip-cache: scripts/requirements-fixtures.txt
          venv: scripts/requirements-fixtures.txt

      - name: Download tonight's build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nightly-linux
          path: candidate

      - name: Download the baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The newest Nightly on main whose startup guard passed and whose build is
          # still kept; the latest release before there is one. A run whose artifact
          # has expired is passed over rather than ending the search at the release.
          passed=""
          for id in $(gh run list --repo "$GITHUB_REPOSITORY" --workflow nightly.yml --branch main \
              --limit 30 --json databaseId -q '.[].databaseId'); do
            [ "$id" = "$GITHUB_RUN_ID" ] && continue
            result=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs?per_page=100" \
              -q '.jobs[] | select(.name == "Startup guard") | .conclusion' || true)
            [ "$result" = success ] || continue
            rm -rf passed
            if gh run download "$id" --repo "$GITHUB_REPOSITORY" --name nightly-linux --dir passed; then
              passed=$id
              break
            fi
          done
          mkdir -p baseline
          if [ -n "$passed" ]; then
            echo "Baseline: Nightly run $passed"
            cp passed/target/release/datui baseline/datui
          else
            echo "Baseline: the latest release"
            gh release download --repo "$GITHUB_REPOSITORY" --pattern 'datui-*-x86_64-unknown-linux-gnu.tar.gz' --dir baseline
            tar xzf baseline/datui-*-x86_64-unknown-linux-gnu.tar.gz -C baseline
          fi
          chmod +x baseline/datui candidate/target/release/datui

      - name: Compare startup
        env:
          # Empty on a scheduled run.
          ACCEPT_BASELINE: ${{ inputs.accept_baseline }}
        run: |
          accept=()
          if [ "$ACCEPT_BASELINE" = true ]; then
            # The baseline is looked up on main only; accepted elsewhere it would pass
            # a regression and become nobody's baseline.
            if [ "$GITHUB_REF" = refs/heads/main ]; then
              echo "::notice::accept_baseline: $GITHUB_ACTOR accepted this build as the startup baseline by hand"
              accept=(--accept)
            else
              echo "::warning::accept_baseline ignored on $GITHUB_REF: only a run on main becomes the baseline"
            fi
          fi
          .venv/bin/python scripts/bench/startup.py guard \
            --baseline baseline/datui \
            --candidate candidate/target/release/datui \
            --data "$RUNNER_TEMP/bench" \
            "${accept[@]}"

  windows:
    runs-on: windows-latest
    timeout-minutes: 150
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the build
        uses: ./.github/actions/setup
        with:
          cache-key: nightly
          pip-cache: |
            scripts/requirements.txt
            scripts/requirements-fixtures.txt
            scripts/requirements-wheel.txt
            scripts/requirements-wheel-windows.txt
            python/pyproject.toml

      - name: Build release binary
        # The C runtime linked in, as release.yml does: a clean Windows has the
        # UCRT but not VCRUNTIME140.dll.
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release --locked -p datui

      - name: Check the binary needs no Visual C++ redistributable
        run: |
          $bytes = [System.IO.File]::ReadAllBytes("target/release/datui.exe")
          $text = [System.Text.Encoding]::ASCII.GetString($bytes)
          if ($text -match '(?i)vcruntime140') { Write-Error "datui.exe imports VCRUNTIME140.dll"; exit 1 }
          Write-Output "datui.exe: no VCRUNTIME140.dll import"

      - name: Bundle CLI for wheel
        run: |
          New-Item -ItemType Directory -Force -Path python/datui_bin
          Copy-Item target/release/datui.exe python/datui_bin/
          Copy-Item LICENSE python/LICENSE

      - name: Build Python wheel
        run: |
          pip install maturin
          cd python
          maturin build --release --out dist

      - name: Upload Windows wheel and binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-windows
          path: |
            python/dist/*.whl
            target/release/datui.exe

  # The test suite, on the platform that otherwise only sees it at release time.
  # CI's windows job is gated on the version not carrying -dev, so it runs on a
  # release commit and nowhere else: every test written during a cycle first
  # meets Windows when the release is already being cut. Three did that for
  # v0.3.2 and all three failed, none of them for a reason datui was at fault for.
  #
  # Its own job rather than steps after the release build, and in the dev
  # profile rather than release. Testing in release looked like it would reuse
  # the build above, but it did not: the release profile's thin LTO runs again
  # for every test executable, around twenty of them, and that alone took the
  # step to 70 minutes. A dev build of the same suite takes a few, runs in
  # parallel with the release build, and gets debug_assertions back.
  #
  # This is a copy of CI's windows job, cache key included. The shared key is
  # the point: CI's job runs too rarely to keep its own cache alive, so on a
  # release commit it has been building from cold. Nightly runs on main, whose
  # cache every branch can restore, so this job keeps that entry warm for it.
  # Keep the two in step; an env difference changes rust-cache's key and
  # silently splits the cache again.
  windows-tests:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the build
        uses: ./.github/actions/setup
        with:
          cache-key: tests
          venv: scripts/requirements.txt scripts/requirements-wheel-windows.txt
          fixtures: true

      - name: Install cargo-nextest
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-nextest

      - name: Build
        timeout-minutes: 40
        run: cargo build --workspace --tests --locked

      # nextest kills a test that hangs (.config/nextest.toml), so one hung test
      # fails alone instead of running the job into its timeout.
      - name: Run tests
        timeout-minutes: 15
        run: cargo nextest run --workspace --locked --no-fail-fast

      - name: Run doctests
        timeout-minutes: 10
        run: cargo test --doc --workspace --locked

      - name: Bundle CLI for wheel
        run: |
          New-Item -ItemType Directory -Force -Path python/datui_bin
          Move-Item target/debug/datui.exe python/datui_bin/
          Copy-Item LICENSE python/LICENSE

      - name: Build and install Python package
        run: |
          .\.venv\Scripts\Activate.ps1
          cd python
          maturin develop

      - name: Run Python tests
        run: |
          .\.venv\Scripts\Activate.ps1
          pytest python/tests/ -v

  macos:
    runs-on: macos-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # rust-cache ignores `key` beside `shared-key`, so the target goes in the
      # shared key; with `key` the two targets raced for one entry.
      - name: Set up the build
        uses: ./.github/actions/setup
        with:
          cache-key: nightly-${{ matrix.target }}
          pip-cache: |
            scripts/requirements.txt
            scripts/requirements-fixtures.txt
            scripts/requirements-wheel.txt
            scripts/requirements-wheel-windows.txt
            python/pyproject.toml

      - name: Add Rust target
        env:
          TARGET: ${{ matrix.target }}
        run: rustup target add "$TARGET"

      - name: Build release binary
        run: cargo build --release --locked -p datui --target ${{ matrix.target }}

      - name: Get version
        id: version
        run: |
          VERSION=$(sed -n '/^\[package\]/,/^\[/p' Cargo.toml | grep -E '^\s*version\s*=' | head -1 | sed 's/.*"\([^"]*\)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Stage and pack tarball
        run: |
          TARGET="${{ matrix.target }}"
          VERSION="${{ steps.version.outputs.version }}"
          STAGING="datui-${VERSION}-${TARGET}"
          mkdir -p "$STAGING"
          cp LICENSE "$STAGING/"
          cp "target/${TARGET}/release/datui" "$STAGING/"
          chmod +x "$STAGING/datui"
          cargo run --locked -q -p datui-cli --bin gen_docs -- dist "$STAGING"
          tar czvf "datui-${VERSION}-${TARGET}.tar.gz" -C "$STAGING" .

      - name: Bundle CLI for wheel
        run: |
          mkdir -p python/datui_bin
          cp "target/${{ matrix.target }}/release/datui" python/datui_bin/
          chmod +x python/datui_bin/datui
          cp LICENSE python/LICENSE

      - name: Build Python wheel
        run: |
          pip install maturin
          python3 scripts/packaging/wheel_manpages.py
          cd python && maturin build --release --out dist --target ${{ matrix.target }}

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-macos-${{ matrix.target }}
          path: |
            datui-${{ steps.version.outputs.version }}-${{ matrix.target }}.tar.gz
            python/dist/*.whl
            target/${{ matrix.target }}/release/datui

  # As on windows: CI's macos job only runs on a release commit, so this is the
  # one place the suite meets macOS during a cycle. Native arm64 only, as CI's
  # job is. Whatever is macOS-specific about a test -- /var resolving to
  # /private/var, for one -- is the same on x86_64.
  #
  # A copy of CI's macos job, dev profile and cache key included, for the
  # reasons spelled out on windows-tests. Release-profile tests took an hour
  # here too, nearly all of it LTO.
  macos-tests:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the build
        uses: ./.github/actions/setup
        with:
          cache-key: tests
          venv: scripts/requirements.txt scripts/requirements-wheel.txt
          fixtures: true

      - name: Install cargo-nextest
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-nextest

      - name: Build
        timeout-minutes: 40
        run: cargo build --workspace --tests --locked

      # nextest kills a test that hangs (.config/nextest.toml), so one hung test
      # fails alone instead of running the job into its timeout.
      - name: Run tests
        timeout-minutes: 15
        run: cargo nextest run --workspace --locked --no-fail-fast

      - name: Run doctests
        timeout-minutes: 10
        run: cargo test --doc --workspace --locked

      - name: Bundle CLI for wheel
        run: |
          mkdir -p python/datui_bin
          mv target/debug/datui python/datui_bin/
          chmod +x python/datui_bin/datui
          cp LICENSE python/LICENSE

      - name: Build and install Python package
        run: . .venv/bin/activate && cd python && maturin develop

      - name: Run Python tests
        run: . .venv/bin/activate && pytest python/tests/ -v

  # The fuzzers proper: each target gets a timed run that generates new input, rather
  # than the corpus replay the test suite does on every pull request. Targets run as a
  # matrix so a slow or failing one does not eat the others' budget, and
  # `fail-fast: false` keeps a crash in one from hiding results in the rest.
  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target:
          - parse_query
          - sql_group_plan
          - number_format
          - fuzzy_match
          - glob_match
          - ipc_stream_head
          - config_parse
          - model_header
          - format_spec
          - gps_parse
          - audio_header
          - midi_file
          - vcd_parse
          - fix_parse
          - fix_dict
          - sdf_parse
          - numpy_header
          - elf_symbols
          - flight_log
          - can_parse
          - text_lines
          - hex_input
    env:
      # The deep configuration. AddressSanitizer can reach the unsafe code inside polars
      # and arrow that these targets feed, which the pull request checks skip
      # because it doubles build size and slows execution. See scripts/code/fuzz.sh.
      DATUI_FUZZ_SANITIZER: address
      # Memory, not disk, is what limits this build. cargo-fuzz forces codegen-units=1, so
      # each crate is one sanitizer-instrumented LLVM module, and polars-core alone peaks at
      # 8.5 GB compiling that way. At the runner's default of four jobs it overlaps
      # polars-expr, polars-ops and arrow-cast (2-3.4 GB each), passes the 15 GB the runner
      # has, and the kernel takes out the runner service mid-compile: the job ends in "The
      # runner has received a shutdown signal" with nothing fuzzed. Two jobs keeps the worst
      # overlap near 12 GB, at the cost of a slower build.
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A sanitizer build of the polars dependency tree runs to roughly 12 GB of build
      # output, which does not fit alongside the runner image. The swap file stays: it is
      # the only headroom this job has if a compile goes past the estimate above.
      - name: Free disk space (Ubuntu)
        # SHA-pinned to defend against upstream takeover; bump deliberately.
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      # Only ~/.cargo (registry and cargo-fuzz itself) is cached, not fuzz/target: a
      # sanitizer build is far too large for the Actions cache, and restoring it would
      # cost more than rebuilding.
      - name: Set up the build
        uses: ./.github/actions/setup
        with:
          cache-key: fuzz-asan
          cache-workspaces: fuzz
          cache-targets: false

      - name: Install cargo-fuzz
        uses: ./.github/actions/install-tools
        with:
          tools: cargo-fuzz

      # Fuzzing is cumulative: the corpus is the set of inputs found to reach somewhere
      # new, and each one is a starting point the mutator builds on. Without this the
      # run would begin from the seed corpus in git every night and re-derive the same
      # shallow ground forever, so anything needing a chain of discoveries would stay
      # out of reach.
      #
      # A cache entry cannot be updated in place, so the key carries the run id to write
      # a fresh entry each night while restore-keys picks up the most recent previous
      # one. Restoring merges on top of the committed seeds rather than replacing them.
      # Restore and save are split rather than using the combined action, because the
      # combined one only writes its cache when the job succeeds. The night a target
      # actually crashes is the night its corpus is most worth keeping, and that is
      # exactly the night the job fails.
      - name: Restore accumulated corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-${{ matrix.target }}-

      # -max_total_time bounds the run; -rss_limit_mb catches a target that starts
      # allocating without bound, which is a finding in its own right. The corpus is
      # seeded from the repository and any new inputs are uploaded below, so a run that
      # finds new coverage is not thrown away. The matrix value reaches the script
      # through the environment rather than being interpolated into it, which is the
      # pattern zizmor wants for every expression that lands in a shell.
      - name: Fuzz
        env:
          FUZZ_TARGET: ${{ matrix.target }}
        run: |
          ./scripts/code/fuzz.sh run "$FUZZ_TARGET" "fuzz/corpus/$FUZZ_TARGET" \
            -- -max_total_time=600 -rss_limit_mb=4096

      # Before the corpus is cached, drop every input that no longer reaches anything
      # the rest does not. Without this it accumulates redundant entries night after
      # night until restoring it costs more than the fuzzing does. Runs even when
      # fuzzing failed, so a crash does not also throw away the night's corpus.
      - name: Minimise corpus
        if: always()
        env:
          FUZZ_TARGET: ${{ matrix.target }}
        run: ./scripts/code/fuzz.sh cmin "$FUZZ_TARGET"

      # A cache entry cannot be updated in place, so the key carries the run id to write
      # a fresh entry each night; the restore step's restore-keys picks up the most
      # recent previous one.
      - name: Save accumulated corpus
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}

      # Uploaded whether or not the run failed: on failure this carries the crashing
      # input needed to reproduce, and on success it carries any new corpus entries
      # worth committing.
      - name: Upload fuzz findings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-${{ matrix.target }}
          path: |
            fuzz/artifacts/
            fuzz/corpus/
          if-no-files-found: ignore
          retention-days: 14

  # datui-lib's optional features are not exercised by the ordinary build, which always
  # uses the default set, so a missing dependency in one of them stays invisible.
  # `dtype-decimal` reached the library only through `polars/sql` for a while, and every
  # build without that feature failed to compile without anyone noticing.
  #
  # Nightly rather than on pull requests: each combination is a fresh polars build, and
  # a regression here is a packaging problem rather than something that breaks a merge.
  features:
    name: Feature combinations
    runs-on: ubuntu-latest
    # The combinations take about 36 minutes and the build without default
    # features about 10 more.
    timeout-minutes: 75
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Each combination's test build is another polars build, 2-3 GB of it locally;
      # five of them beside the lints outgrow what the runner image leaves free.
      - name: Free disk space (Ubuntu)
        # SHA-pinned to defend against upstream takeover; bump deliberately.
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      # Five feature sets of Polars test builds would crowd the PR cache out of the
      # repository's 10 GB budget; the cache keeps only the registry. The tests
      # read the fixtures, cached as CI's are.
      - name: Set up the build
        uses: ./.github/actions/setup
        with:
          cache-key: features
          cache-targets: false
          fixtures: true

      # Every feature alone and none at all. The full powerset would be sixteen polars
      # builds to catch interactions that have never actually broken; each feature on its
      # own is where the missing dependencies show up. Clippy over all targets, for the
      # binary and the library: test code gated on the wrong feature fails here (#481).
      # Then the library's own tests in each: a test that compiles can still assume a
      # feature it does not name, and nothing else runs them without the defaults.
      - name: Lint and test each feature in isolation
        run: ./scripts/dev/test.sh features --test

      # A check compiles the configuration; it does not run it. The `(all files)` row
      # was behind `feature = "cloud"` long after it stopped being a cloud row, so a
      # build without the feature had no second door at all — and every test that says
      # otherwise passed, because none of them ran in that configuration.
      - name: Test without default features
        run: cargo test --no-default-features

  # The docs' examples that read public data (#683): the network shell, config and
  # Python blocks, the network examples of examples.toml, and the docs' queries run
  # on the datasets they name. The local ones run on every pull request (ci.yml).
  docs-network:
    name: Docs examples (network)
    needs: linux
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the release build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nightly-linux
          path: nightly

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'

      - name: Install the wheel
        run: |
          python -m venv .venv
          .venv/bin/pip install nightly/python/dist/*.whl
          chmod +x nightly/target/release/datui

      - name: Run the network blocks and examples
        run: |
          .venv/bin/python scripts/docs/doc_examples.py --bin nightly/target/release/datui --network
          .venv/bin/python scripts/docs/doc_examples.py --python --network

      # CI linux's entry from main, restore only.
      - name: Set up the build
        uses: ./.github/actions/setup
        with:
          cache-key: tests
          cache-save: never

      - name: Run the docs' queries on the public datasets
        run: |
          .venv/bin/python scripts/docs/doc_examples.py --fetch-datasets "$RUNNER_TEMP/doc-data"
          DATUI_DOC_DATA="$RUNNER_TEMP/doc-data" cargo test -p datui-lib --lib --locked doc_queries -- --ignored

  # A scheduled failure opens an issue, or comments on the open one, so a red
  # Nightly is noticed instead of becoming background. Runs by hand report in the
  # run itself.
  report:
    needs: [linux, startup-guard, windows, windows-tests, macos, macos-tests, fuzz, features, docs-network]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          NEEDS: ${{ toJSON(needs) }}
        run: |
          title="Nightly failed"
          failed=$(jq -r 'to_entries[] | select(.value.result == "failure") | .key' <<<"$NEEDS" | paste -sd, - | sed 's/,/, /g')
          existing=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Failed again ($failed): $RUN_URL"
          else
            gh issue create --title "$title" --body "The scheduled Nightly run failed in: $failed.

          $RUN_URL

          Close this issue once Nightly passes again; the next failure opens a new one."
          fi
