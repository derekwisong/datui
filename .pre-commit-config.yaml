# Pre-commit hooks for datui
# Install with: pre-commit install
# Run manually with: pre-commit run --all-files

repos:
  # The same commands CI runs, through the one entry point. clippy waits its turn
  # with other heavy runs on the machine (scripts/dev/test.sh --help).
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: scripts/dev/test.sh fmt --check
        language: system
        types: [rust]
        pass_filenames: false
      - id: cargo-clippy
        name: cargo clippy
        entry: scripts/dev/test.sh clippy
        language: system
        types: [rust]
        pass_filenames: false
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        name: check added large files
        # Captures (scripts/demos/capture.py) are versioned; keep the guard everywhere else.
        exclude: ^demos/.*\.(gif|webm|png)$
      - id: trailing-whitespace
        name: trailing whitespace
        args: [--markdown-linebreak-ext=md]
        # Fuzzing corpus entries are opaque input, not text. Several are raw bytes
        # that `arbitrary` decodes, and rewriting one to strip a trailing 0x20
        # silently changes the test case it represents.
        exclude: ^fuzz/corpus/
