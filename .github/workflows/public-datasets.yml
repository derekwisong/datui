name: Example datasets

# The bundled `public` catalog points at data other organisations host.
# datui hosts none of it, so nothing tells us when a publisher moves or retires a
# dataset except checking. Once a week, and on pull requests that touch the cloud code
# or the list, list and open every entry with no credentials at all, the way a new
# user sees them. A scheduled failure opens an issue, or comments on the open one.
#
# No secrets: the data is public, and the point is to read it as someone with no login.

on:
  schedule:
    # Mondays at 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - 'crates/datui-lib/src/home/public_catalog.toml'
      - 'crates/datui-lib/src/config/mod.rs'
      - 'crates/datui-lib/src/home/catalog.rs'
      - 'crates/datui-lib/src/cloud/cloud_sources.rs'
      - 'crates/datui-lib/src/cloud/cloud_browse.rs'
      - 'crates/datui-lib/src/cloud/azure.rs'
      - 'tests/cloud_live_test.rs'
      - '.github/workflows/public-datasets.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable

      - name: Install system dependencies
        timeout-minutes: 5
        run: |
          echo 'Acquire::Retries "3"; Acquire::http::Timeout "30";' | sudo tee /etc/apt/apt.conf.d/99timeouts >/dev/null
          sudo apt-get update || echo '::warning::apt-get update reported errors; continuing'
          sudo apt-get install -y pkg-config

      # CI linux's entry from main, restore only: the same debug test build and env.
      - name: Cache cargo dependencies
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: tests
          save-if: false

      - name: List and open every public dataset with no credentials
        env:
          DATUI_LIVE_PUBLIC: "1"
        run: |
          # A runner has no cloud login, but make sure: nothing here may be read signed.
          unset AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN AWS_PROFILE \
            GOOGLE_APPLICATION_CREDENTIALS AZURE_STORAGE_CONNECTION_STRING
          # An empty home, so no tool's login file is found. rustup finds its toolchains
          # through HOME unless told otherwise.
          export RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}"
          export HOME="$RUNNER_TEMP/home" && mkdir -p "$HOME"
          cargo test --test cloud_live_test -- --ignored --nocapture --test-threads=1 \
            every_public_dataset_lists_and_opens \
            public_datasets_browse_and_open_from_the_home_screen \
            public_data_quirks \
            partitioned_cloud_directories_are_hive_datasets

  report:
    needs: check
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    # No scheduled failures in the sample; five minutes for the issue API calls.
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Example datasets check failed"
          existing=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          body="The weekly check of the built-in public datasets failed: $RUN_URL

          A dataset may have moved, been retired, or changed its access. Update \`crates/datui-lib/src/home/public_catalog.toml\`, or fix whatever in datui stopped reading it."
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Failed again: $RUN_URL"
          else
            gh issue create --title "$title" --body "$body"
          fi
