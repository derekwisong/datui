name: Install tools
description: >-
  Cargo tools at the versions .github/tool-versions pins: a checksummed
  prebuilt binary where install-action has one, `cargo install --locked`
  otherwise.

inputs:
  tools:
    description: Space-separated tool names, each listed in .github/tool-versions.
    required: true

runs:
  using: composite
  steps:
    - name: Look up the pinned versions
      id: pins
      shell: bash
      env:
        TOOLS: ${{ inputs.tools }}
      run: |
        specs=()
        for tool in $TOOLS; do
          version=$(awk -v t="$tool" '$1 == t { print $2 }' "$GITHUB_WORKSPACE/.github/tool-versions")
          [ -n "$version" ] || { echo "::error::$tool has no version in .github/tool-versions"; exit 1; }
          specs+=("$tool@$version")
        done
        echo "tool=$(IFS=,; echo "${specs[*]}")" >> "$GITHUB_OUTPUT"

    - name: Install
      uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
      with:
        tool: ${{ steps.pins.outputs.tool }}
        fallback: cargo-install
