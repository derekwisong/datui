name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# This kills redundant builds if you push multiple times to the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Cancel superseded runs on a pull request, never on main. Pushing twice to a
  # branch should not build it twice; merging twice in quick succession leaves
  # main with cancelled runs, and a cancelled run reads as a failed one on the
  # README badge and in the branch history.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Incremental compilation only pays off across repeated local edits. In CI every
  # job starts from a restored cache and builds once, so it is pure overhead: it
  # slows compilation and inflates target/ (and therefore the cache) for nothing.
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      is_dev_version: ${{ steps.version.outputs.is_dev_version }}
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set dev version output
        id: version
        run: |
          VERSION=$(sed -n '/^\[package\]/,/^\[/p' Cargo.toml | grep -E '^\s*version\s*=' | head -1 | sed 's/.*"\([^"]*\)".*/\1/')
          if [[ "$VERSION" == *-dev ]]; then
            echo "is_dev_version=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_dev_version=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - name: Install system dependencies
        run: |
          # The runner image ships third-party apt repositories datui does not use (Chrome, for one).
          # When one of those serves a bad index, `apt-get update` exits non-zero and fails a build
          # that had nothing to do with it. The install below is the real gate: if Ubuntu's own
          # indexes did not fetch, it fails there, for the right reason.
          sudo apt-get update || echo '::warning::apt-get update reported errors; continuing'
          sudo apt-get install -y pkg-config libfontconfig1-dev

      - name: Cache cargo dependencies
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci
          cache-workspace-crates: true

      - name: Check formatting
        run: ./scripts/code/check_format.sh

      - name: Run clippy
        run: ./scripts/code/check_clippy.sh

  # Replay the committed fuzz corpus. This does not look for new bugs — that is the
  # Nightly workflow's job — it re-runs every input already known to be interesting and
  # fails if one of them starts crashing again. Deterministic and quick, so it can gate
  # every pull request.
  fuzz:
    name: Fuzz corpus replay
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - name: Install system dependencies
        run: |
          sudo apt-get update || echo '::warning::apt-get update reported errors; continuing'
          sudo apt-get install -y pkg-config libfontconfig1-dev

      # Its own cache key: the fuzz crate is a separate workspace built with coverage
      # instrumentation, so none of its artifacts are shareable with the ordinary build.
      # This job runs without a sanitizer (the default in scripts/code/fuzz.sh), which
      # is what keeps fuzz/target small enough to cache at all.
      - name: Cache cargo dependencies
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: fuzz
          workspaces: fuzz

      # Installed from source rather than via a marketplace action: every action in
      # this repository is SHA-pinned, and adding one more third party to the supply
      # chain for a tool `cargo install` provides is a poor trade. rust-cache restores
      # ~/.cargo/bin, so this is a no-op on all but the first run.
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Replay corpus
        run: ./scripts/code/fuzz.sh replay

  linux:
    runs-on: ubuntu-latest
    needs: [check]
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show disk space before build
        run: df -h

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - name: Run sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Install system dependencies
        run: |
          # The runner image ships third-party apt repositories datui does not use (Chrome, for one).
          # When one of those serves a bad index, `apt-get update` exits non-zero and fails a build
          # that had nothing to do with it. The install below is the real gate: if Ubuntu's own
          # indexes did not fetch, it fails there, for the right reason.
          sudo apt-get update || echo '::warning::apt-get update reported errors; continuing'
          sudo apt-get install -y pkg-config libfontconfig1-dev python3-dev

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'
          cache: 'pip'
          cache-dependency-path: |
            scripts/requirements.txt
            scripts/requirements-wheel.txt
            scripts/requirements-wheel-windows.txt
            python/pyproject.toml

      - name: Cache cargo dependencies
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci
          cache-workspace-crates: true

      - name: Create virtual environment and install requirements
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -r scripts/requirements.txt
          .venv/bin/pip install -r scripts/requirements-wheel.txt

      - name: Generate sample data
        run: .venv/bin/python scripts/generate_sample_data.py

      - name: Build
        run: cargo build --workspace --tests --locked

      - name: Run tests
        # --no-fail-fast so one failing test binary does not hide the others. The
        # macOS and Windows jobs only run on a release version, so a round trip here
        # costs a re-tag, not a re-push -- finding every failure in one run matters.
        run: cargo test --workspace --locked --no-fail-fast

      - name: Verify binary exists
        run: test -f target/debug/datui || (echo "Binary not found" && exit 1)

      - name: Verify manpage was generated
        run: |
          if ! find target/debug/build -name "datui.1" -type f | head -1 >/dev/null; then
            echo "Manpage not found" && exit 1
          fi

      - name: Bundle CLI for wheel
        run: |
          mkdir -p python/datui_bin
          mv target/debug/datui python/datui_bin/
          chmod +x python/datui_bin/datui
          cp LICENSE python/LICENSE

      - name: Build and install Python package
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: . .venv/bin/activate && cd python && maturin develop

      - name: Run Python tests
        run: . .venv/bin/activate && pytest python/tests/ -v

      - name: Show disk space after build
        run: df -h

  windows:
    runs-on: windows-latest
    needs: [check]
    if: needs.check.outputs.is_dev_version != 'true'
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - name: Run sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'
          cache: 'pip'
          cache-dependency-path: |
            scripts/requirements.txt
            scripts/requirements-wheel.txt
            scripts/requirements-wheel-windows.txt
            python/pyproject.toml

      - name: Cache cargo dependencies
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci
          cache-workspace-crates: true

      - name: Create virtual environment and install requirements
        run: |
          python -m venv .venv
          .venv\Scripts\python.exe -m pip install --upgrade pip
          .venv\Scripts\pip.exe install -r scripts/requirements.txt
          .venv\Scripts\pip.exe install -r scripts/requirements-wheel-windows.txt

      - name: Generate sample data
        run: .venv\Scripts\python.exe scripts/generate_sample_data.py

      - name: Build
        run: cargo build --workspace --tests --locked

      - name: Run tests
        # --no-fail-fast so one failing test binary does not hide the others. The
        # macOS and Windows jobs only run on a release version, so a round trip here
        # costs a re-tag, not a re-push -- finding every failure in one run matters.
        run: cargo test --workspace --locked --no-fail-fast

      - name: Verify binary exists
        run: |
          if (!(Test-Path target\debug\datui.exe)) { Write-Error "Binary not found"; exit 1 }

      - name: Bundle CLI for wheel
        run: |
          New-Item -ItemType Directory -Force -Path python/datui_bin
          Move-Item target/debug/datui.exe python/datui_bin/
          Copy-Item LICENSE python/LICENSE

      - name: Build and install Python package
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          .\.venv\Scripts\Activate.ps1
          cd python
          maturin develop

      - name: Run Python tests
        run: |
          .\.venv\Scripts\Activate.ps1
          pytest python/tests/ -v

  macos:
    runs-on: macos-latest
    needs: [check]
    if: needs.check.outputs.is_dev_version != 'true'
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - name: Run sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'
          cache: 'pip'
          cache-dependency-path: |
            scripts/requirements.txt
            scripts/requirements-wheel.txt
            scripts/requirements-wheel-windows.txt
            python/pyproject.toml

      - name: Cache cargo dependencies
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci
          cache-workspace-crates: true

      - name: Create virtual environment and install requirements
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -r scripts/requirements.txt
          .venv/bin/pip install -r scripts/requirements-wheel.txt

      - name: Generate sample data
        run: .venv/bin/python scripts/generate_sample_data.py

      - name: Build
        run: cargo build --workspace --tests --locked

      - name: Run tests
        # --no-fail-fast so one failing test binary does not hide the others. The
        # macOS and Windows jobs only run on a release version, so a round trip here
        # costs a re-tag, not a re-push -- finding every failure in one run matters.
        run: cargo test --workspace --locked --no-fail-fast

      - name: Verify binary exists
        run: test -f target/debug/datui || (echo "Binary not found" && exit 1)

      - name: Verify manpage was generated
        run: |
          if ! find target/debug/build -name "datui.1" -type f | head -1 >/dev/null; then
            echo "Manpage not found" && exit 1
          fi

      - name: Bundle CLI for wheel
        run: |
          mkdir -p python/datui_bin
          mv target/debug/datui python/datui_bin/
          chmod +x python/datui_bin/datui
          cp LICENSE python/LICENSE

      - name: Build and install Python package
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: . .venv/bin/activate && cd python && maturin develop

      - name: Run Python tests
        run: . .venv/bin/activate && pytest python/tests/ -v
