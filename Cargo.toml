[workspace]
members = ["crates/datui-lib", "crates/datui-cli"]
# Exclude datui-pyo3: requires Python at link time; exclude lets maturin build it standalone.
exclude = ["crates/datui-pyo3"]
resolver = "2"

[package]
name = "datui"
version = "0.4.5"
edition = "2024"
rust-version = "1.95"
authors = ["Derek Wisong"]
# generated: description
description = "Explore tabular data in your terminal: Parquet, CSV, JSON and more"
# end generated: description
repository = "https://github.com/derekwisong/datui"
homepage = "https://derekwisong.github.io/datui"
license = "MIT"
readme = "README.md"
keywords = ["cli", "tui", "data", "utility", "analysis"]
categories = ["command-line-utilities", "science"]
# Only what the binary builds from: crates.io refuses a package over 10 MiB, and the
# repo's demos, docs and tests are far past that.
include = ["/src", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE"]

[[bin]]
name = "datui"
path = "src/main.rs"

[features]
default = ["cloud", "http", "sql", "sqlite", "streaming"]
cloud = ["datui/cloud"]
http = ["datui/http"]
sql = ["datui/sql"]
sqlite = ["datui/sqlite"]
streaming = ["datui/streaming"]

[dependencies]
# Import as `datui` in Rust; package name is datui-lib. Its features come from ours,
# so `--no-default-features` here reaches the library.
datui = { path = "crates/datui-lib", package = "datui-lib", version = "0.4.5", default-features = false }
datui-cli = { path = "crates/datui-cli", version = "0.4.5"}
clap = { version = "4.5.54", features = ["derive"] }
color-eyre = "0.6.5"

[dev-dependencies]
# Integration tests drive the app through its key events and draw it.
crossterm = "0.29.0"
ratatui = { version = "0.30.0", features = ["all-widgets"] }
# For integration tests (tests/*.rs) that use polars and config parsing
polars = { version = "0.55", features = ["lazy"] }
tempfile = "3.8"
tokio = { version = "1", features = ["rt-multi-thread"] }
fs2 = "0.4"
toml = "1.1"
# The fixture stamp's digest (tests/shared.rs). Polars already builds it.
sha2 = "0.11"
# Writing compressed fixtures. Already `datui-lib`'s, so nothing new enters the tree.
flate2 = "1.0"
zstd = "0.14"
bzip2 = "0.6"
xz2 = "0.1"
# Reading an Avro file's schema back. Also `datui-lib`'s.
serde_json = "1.0"
# Decodes fuzz corpus inputs in tests/fuzz_corpus_test.rs as libfuzzer-sys does.
# Already in fuzz/Cargo.lock; the test checks both lockfiles agree on its version.
arbitrary = { version = "1", features = ["derive"] }

# A pseudo-terminal for tests/startup_test.rs. Also `datui-lib`'s.
[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

# Packaging: deb, rpm, cargo-binstall. The AUR package is
# scripts/packaging/PKGBUILD.in, filled in by build_package.py.
[package.metadata.deb]
maintainer = "Derek Wisong"
# Not "$auto": dpkg-shlibdeps on the build host maps the pthread and dl symbols,
# moved into libc in 2.34, to libc6 (>= 2.34). The binary is linked against 2.28
# and needs nothing else (the release gate checks both).
depends = "libc6 (>= 2.28)"
# generated: deb-description
extended-description = "Parquet, CSV, JSON, Arrow, Excel, SQLite, logs, audio, model files and more, including binary formats you describe in a format spec. On disk or in S3, GCS, Azure and HTTP(S). Query with SQL or q, sort and filter, chart, analyze and export."
# end generated: deb-description
license-file = ["LICENSE", "0"]
# The manpages and completions are staged in target/dist by
# scripts/packaging/build_package.py (`gen_docs dist`, then gzip).
assets = [
    "$auto",
    ["target/dist/gz/man1/*", "usr/share/man/man1/", "0644"],
    ["target/dist/gz/man5/*", "usr/share/man/man5/", "0644"],
    ["target/dist/gz/man7/*", "usr/share/man/man7/", "0644"],
    ["target/dist/completions/datui.bash", "usr/share/bash-completion/completions/datui", "0644"],
    ["target/dist/completions/_datui", "usr/share/zsh/vendor-completions/_datui", "0644"],
    ["target/dist/completions/datui.fish", "usr/share/fish/vendor_completions.d/datui.fish", "0644"],
    ["scripts/packaging/datui.desktop", "usr/share/applications/datui.desktop", "0644"],
]

# Requires come from ldd on the binary: libc.so.6(GLIBC_2.28) and libgcc_s.
[package.metadata.generate-rpm]
[[package.metadata.generate-rpm.assets]]
source = "target/release/datui"
dest = "/usr/bin/datui"
mode = "0755"

[[package.metadata.generate-rpm.assets]]
source = "target/dist/gz/man1/*"
dest = "/usr/share/man/man1/"
mode = "0644"
doc = true

[[package.metadata.generate-rpm.assets]]
source = "target/dist/gz/man5/*"
dest = "/usr/share/man/man5/"
mode = "0644"
doc = true

[[package.metadata.generate-rpm.assets]]
source = "target/dist/gz/man7/*"
dest = "/usr/share/man/man7/"
mode = "0644"
doc = true

[[package.metadata.generate-rpm.assets]]
source = "target/dist/completions/datui.bash"
dest = "/usr/share/bash-completion/completions/datui"
mode = "0644"

[[package.metadata.generate-rpm.assets]]
source = "target/dist/completions/_datui"
dest = "/usr/share/zsh/site-functions/_datui"
mode = "0644"

[[package.metadata.generate-rpm.assets]]
source = "target/dist/completions/datui.fish"
dest = "/usr/share/fish/vendor_completions.d/datui.fish"
mode = "0644"

[[package.metadata.generate-rpm.assets]]
source = "scripts/packaging/datui.desktop"
dest = "/usr/share/applications/datui.desktop"
mode = "0644"

[[package.metadata.generate-rpm.assets]]
source = "LICENSE"
dest = "/usr/share/licenses/datui/LICENSE"
mode = "0644"
doc = true

# `cargo binstall datui`: the release archives, named datui-vX.Y.Z-TRIPLE, with
# the binary at the archive's root. release.yml names them; keep the two in step.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }{ archive-suffix }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

# Dev-loop build speed. A full-debuginfo build produced a 1.9 GB binary, of which
# 1.5 GB was DWARF (.debug_str alone was 1.09 GB). Linking that into the binary
# plus every integration test at once exhausted RAM and drove the machine into
# swap. Dependencies get no debuginfo; our own crates keep line tables, which is
# what color-eyre needs to print file:line in backtraces.
[profile.dev]
debug = "line-tables-only"

# Dependencies at opt-level 1: Polars unoptimized makes every test slow and every
# test executable large. Our own crates stay at 0 so edits rebuild fast; the cost is
# a slower cold dependency build, paid when the lockfile or toolchain changes.
[profile.dev.package."*"]
debug = false
opt-level = 1

# improve the performance of color-eyre for debug builds
[profile.dev.package.backtrace]
opt-level = 3

[profile.release]
# "debuginfo" rather than true/"symbols": keep .symtab so color-eyre can resolve
# function names in panic backtraces from released binaries. Release already sets
# debug = false, so there is no DWARF to carry -- this is symbol names only.
strip = "debuginfo"
lto = "thin"
codegen-units = 1
opt-level = 3
