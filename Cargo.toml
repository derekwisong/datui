[workspace]
members = ["crates/datui-lib", "crates/datui-cli"]
# Exclude datui-pyo3: requires Python at link time; exclude lets maturin build it standalone.
exclude = ["crates/datui-pyo3"]
resolver = "2"

[package]
name = "datui"
version = "0.3.2-dev"
edition = "2021"
authors = ["Derek Wisong"]
description = "Data Exploration in the Terminal"
repository = "https://github.com/derekwisong/datui"
homepage = "https://derekwisong.github.io/datui"
license = "MIT"
readme = "README.md"
keywords = ["cli", "tui", "data", "utility", "analysis"]
categories = ["command-line-utilities", "science"]

[[bin]]
name = "datui"
path = "src/main.rs"

[features]
default = ["cloud", "http", "sql", "streaming"]
cloud = ["datui/cloud"]
http = ["datui/http"]
sql = ["datui/sql"]
streaming = ["datui/streaming"]

[dependencies]
# Import as `datui` in Rust; package name is datui-lib
datui = { path = "crates/datui-lib", package = "datui-lib", version = "0.3.2-dev" }
datui-cli = { path = "crates/datui-cli", version = "0.3.2-dev"}
clap = { version = "4.5.54", features = ["derive"] }
color-eyre = "0.6.5"
crossterm = "0.29.0"
ratatui = { version = "0.29.0", features = ["all-widgets"] }

[build-dependencies]
clap = { version = "4.5.54", features = ["derive"] }
clap_mangen = "0.3"
datui-cli = { path = "crates/datui-cli", version = "0.3.2-dev" }

[dev-dependencies]
# For integration tests (tests/*.rs) that use polars and config parsing
polars = { version = "0.52", features = ["lazy"] }
tempfile = "3.8"
tokio = { version = "1", features = ["rt-multi-thread"] }
fs2 = "0.4"
toml = "1.1"

# Packaging: deb, rpm, AUR.
[package.metadata.deb]
maintainer = "Derek Wisong"
license-file = ["LICENSE", "0"]
depends = ["libfontconfig1"]
assets = [
    "$auto",
    ["target/release/datui.1.gz", "usr/share/man/man1/datui.1.gz", "0644"],
    ["scripts/packaging/datui.desktop", "usr/share/applications/datui.desktop", "0644"],
]

[package.metadata.generate-rpm]
[[package.metadata.generate-rpm.assets]]
source = "target/release/datui"
dest = "/usr/bin/datui"
mode = "0755"

[[package.metadata.generate-rpm.assets]]
source = "target/release/datui.1.gz"
dest = "/usr/share/man/man1/datui.1.gz"
mode = "0644"

[[package.metadata.generate-rpm.assets]]
source = "scripts/packaging/datui.desktop"
dest = "/usr/share/applications/datui.desktop"
mode = "0644"

[[package.metadata.generate-rpm.assets]]
source = "LICENSE"
dest = "/usr/share/licenses/datui/LICENSE"
mode = "0644"
doc = true

[package.metadata.generate-rpm.requires]
fontconfig = "*"

[package.metadata.aur]
depends = ["fontconfig"]
# Do not add LICENSE to files: cargo-aur already includes it when license is MIT
# (must_copy_license). Adding it here too made tar store it twice (second as hardlink),
# which caused "Can't create 'LICENSE'" when bsdtar extracted on the AUR.
files = [
    ["target/release/datui.1.gz", "/usr/share/man/man1/datui.1.gz"],
    # Puts datui in desktop launchers. On Omarchy that means it appears under the
    # menu's Apps section automatically, with no Omarchy-specific integration.
    ["scripts/packaging/datui.desktop", "/usr/share/applications/datui.desktop"],
]

# Dev-loop build speed. A full-debuginfo build produced a 1.9 GB binary, of which
# 1.5 GB was DWARF (.debug_str alone was 1.09 GB). Linking that into the binary
# plus every integration test at once exhausted RAM and drove the machine into
# swap. Dependencies get no debuginfo; our own crates keep line tables, which is
# what color-eyre needs to print file:line in backtraces.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# improve the performance of color-eyre for debug builds
[profile.dev.package.backtrace]
opt-level = 3

[profile.release]
# "debuginfo" rather than true/"symbols": keep .symtab so color-eyre can resolve
# function names in panic backtraces from released binaries. Release already sets
# debug = false, so there is no DWARF to carry -- this is symbol names only.
strip = "debuginfo"
lto = "thin"
codegen-units = 1
opt-level = 3
