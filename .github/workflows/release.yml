name: Release

# Read-only by default. The `publish` job, the only one that writes a release
# or deploys Pages, grants itself contents/pages/id-token. Every build job runs
# with a token that cannot modify the repository, so a compromised build step
# cannot rewrite a tag or replace a release asset.
permissions:
  contents: read

on:
  push:
    tags:
      - 'v*'
  # A dry run: builds every asset and runs the Linux gate, and publishes
  # nothing. The fuzz replay and the docs are skipped; they do not depend on
  # how the binaries are built. Run it from a branch to try a change to the
  # builds before a tag depends on it.
  workflow_dispatch: {}

env:
  MDBOOK_VERSION: "0.5.2"

jobs:
  check-ci-passed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful CI for this commit
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Only allow release if the CI workflow has a successful run for this commit SHA.
          # Recommended flow: push release commit to main → wait for CI to pass → then tag and push tag.
          RUNS=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs?head_sha=${{ github.sha }}&per_page=20")
          CI_SUCCESS=$(echo "$RUNS" | jq -r '.workflow_runs[] | select(.name == "CI" and .conclusion == "success") | .id' | head -1)
          if [ -z "$CI_SUCCESS" ] || [ "$CI_SUCCESS" = "null" ]; then
            echo "::error::No successful CI run found for commit ${{ github.sha }}. Push this commit to main, wait for CI to pass, then push the tag."
            exit 1
          fi
          echo "CI run $CI_SUCCESS passed for this commit."

      - name: Dry run
        if: github.event_name != 'push'
        env:
          REF_NAME: ${{ github.ref_name }}
        run: echo "Dry run from $REF_NAME, building and checking; nothing is published."

  fuzz:
    name: Fuzz corpus replay (ASan)
    runs-on: ubuntu-latest
    needs: [check-ci-passed]
    if: github.event_name == 'push'
    # Slowest Nightly fuzz job in the last 50 runs: 47m48s (run 36274717293).
    # Above 1.5x that time, with room to link and replay all six targets.
    timeout-minutes: 90
    env:
      DATUI_FUZZ_SANITIZER: address
      # Match Nightly: ASan-instrumented Polars can exhaust memory at four jobs.
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The ASan build needs roughly 12 GB of disk; keep swap for compile peaks.
      - name: Free disk space (Ubuntu)
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable

      - name: Install system dependencies
        timeout-minutes: 5
        run: |
          echo 'Acquire::Retries "3"; Acquire::http::Timeout "30";' | sudo tee /etc/apt/apt.conf.d/99timeouts >/dev/null
          sudo apt-get update || echo '::warning::apt-get update reported errors; continuing'
          sudo apt-get install -y pkg-config

      # Restore Nightly's registry and tools only; the ASan target dir is too large.
      - name: Cache cargo dependencies
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: fuzz-asan
          workspaces: fuzz
          cache-targets: false
          save-if: false

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      # Always replay this tag's committed corpora, regardless of Nightly's result.
      - name: Replay every corpus under ASan
        run: ./scripts/code/fuzz.sh replay

      - name: Upload fuzz findings
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-fuzz-findings
          path: fuzz/artifacts/
          if-no-files-found: ignore
          retention-days: 14

  # The Linux binaries are linked by zig against glibc 2.28 (cargo zigbuild's
  # `TRIPLE.2.28`), whatever glibc the runner has, so a release runs on Debian 10,
  # Ubuntu 20.04, RHEL 8 and everything newer. Built natively on each
  # architecture's runner: zig only lowers the glibc, and the packagers (cargo-deb's
  # dpkg-shlibdeps, cargo-generate-rpm's ldd) then read the binary on the
  # architecture it is for. The wheel's extension is built the same way, as a
  # manylinux_2_28 wheel. `linux-gate` proves both before anything is published.
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    needs: [check-ci-passed]
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      TARGET: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free disk space (Ubuntu)
        # SHA-pinned to defend against upstream takeover; bump deliberately.
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable

      - name: Install system dependencies
        timeout-minutes: 5
        run: |
          # The runner image ships third-party apt repositories datui does not use (Chrome, for one).
          # When one of those serves a bad index, `apt-get update` exits non-zero and fails a build
          # that had nothing to do with it. The install below is the real gate: if Ubuntu's own
          # indexes did not fetch, it fails there, for the right reason.
          echo 'Acquire::Retries "3"; Acquire::http::Timeout "30";' | sudo tee /etc/apt/apt.conf.d/99timeouts >/dev/null
          sudo apt-get update || echo '::warning::apt-get update reported errors; continuing'
          sudo apt-get install -y pkg-config python3-dev

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'
          cache: 'pip'
          cache-dependency-path: scripts/requirements-release.txt

      - name: Install zig, cargo-zigbuild and maturin
        run: pip install -r scripts/requirements-release.txt

      - name: Cache cargo dependencies
        # Restores what the Nightly workflow built on main, and never saves. A
        # cache entry is scoped to the ref that wrote it, and a tag run can read
        # its own tag's entries and main's, nothing else. The `release` key this
        # used to share was only ever written from tags, so every release found
        # nothing, built from cold (57 minutes on Windows), then spent quota
        # saving an entry no later tag could reach. Nightly's release build uses
        # the same commands and env, so its key prefix matches here (keep the two in
        # step: rust-cache hashes CARGO*/RUST* env into the key); the version
        # bump changes the lockfile hash, and rust-cache falls back to the most
        # recent nightly entry, which differs by datui's own crates.
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: nightly
          save-if: false
          cache-workspace-crates: true

      - name: Build release binary against glibc 2.28
        run: cargo zigbuild --release --locked -p datui --target "$TARGET.2.28"

      - name: Place the binary where the packagers read it
        run: install -D "target/$TARGET/release/datui" target/release/datui

      - name: Cache cargo packaging tools
        id: cache-cargo-tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin
          key: ${{ runner.os }}-cargo-packaging-tools-v2
          restore-keys: |
            ${{ runner.os }}-cargo-packaging-tools-

      - name: Install cargo packaging tools
        run: |
          command -v cargo-deb || cargo install cargo-deb
          command -v cargo-generate-rpm || cargo install cargo-generate-rpm

      - name: Build deb package
        run: python3 scripts/packaging/build_package.py deb --no-build

      - name: Build rpm package
        run: python3 scripts/packaging/build_package.py rpm --no-build

      - name: Build tarball and AUR PKGBUILD
        run: python3 scripts/packaging/build_package.py aur --no-build

      - name: Bundle CLI for wheel
        run: |
          mkdir -p python/datui_bin
          cp target/release/datui python/datui_bin/
          chmod +x python/datui_bin/datui
          cp LICENSE python/LICENSE

      - name: Build Python wheel (manylinux_2_28)
        # With the manpages as data files, installed under the prefix's share/man.
        run: |
          python3 scripts/packaging/wheel_manpages.py
          cd python && maturin build --release --out dist --target "$TARGET" --zig --manylinux 2_28

      - name: Collect release assets
        run: |
          mkdir -p dist
          cp target/debian/*.deb target/generate-rpm/*.rpm target/tarball/*.tar.gz \
             target/aur/PKGBUILD python/dist/*.whl dist/
          ls -l dist

      - name: Upload linux artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: datui-linux-artifacts
          path: dist/*

  linux-arm64:
    # The linux job on a native arm64 runner, without the AUR PKGBUILD (the
    # package is x86_64 only). Its outputs are what install.sh asks for on an
    # aarch64 machine: datui_<ver>-1_arm64.deb, datui-<ver>-1.aarch64.rpm,
    # datui-v<ver>-aarch64-unknown-linux-gnu.tar.gz, and the aarch64 wheel.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    needs: [check-ci-passed]
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      TARGET: aarch64-unknown-linux-gnu
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
      - name: Run sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Install system dependencies
        timeout-minutes: 5
        run: |
          # See the linux job for why `apt-get update` is allowed to fail here.
          echo 'Acquire::Retries "3"; Acquire::http::Timeout "30";' | sudo tee /etc/apt/apt.conf.d/99timeouts >/dev/null
          sudo apt-get update || echo '::warning::apt-get update reported errors; continuing'
          sudo apt-get install -y pkg-config python3-dev

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'
          cache: 'pip'
          cache-dependency-path: scripts/requirements-release.txt

      - name: Install zig, cargo-zigbuild and maturin
        run: pip install -r scripts/requirements-release.txt

      # No rust-cache step: Nightly writes its entry from an x86_64 runner, and
      # the key includes the host triple, so this job would never hit it.

      - name: Build release binary against glibc 2.28
        run: cargo zigbuild --release --locked -p datui --target "$TARGET.2.28"

      - name: Place the binary where the packagers read it
        run: install -D "target/$TARGET/release/datui" target/release/datui

      - name: Cache cargo packaging tools
        id: cache-cargo-tools
        # runner.arch is in the key: the linux job's entry holds x86_64 binaries,
        # which would restore here and fail to execute.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-packaging-tools-v2
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-packaging-tools-

      - name: Install cargo packaging tools
        run: |
          command -v cargo-deb || cargo install cargo-deb
          command -v cargo-generate-rpm || cargo install cargo-generate-rpm

      - name: Build deb package
        run: python3 scripts/packaging/build_package.py deb --no-build

      - name: Build rpm package
        run: python3 scripts/packaging/build_package.py rpm --no-build

      - name: Build tarball
        run: python3 scripts/packaging/build_package.py tarball --no-build

      - name: Bundle CLI for wheel
        run: |
          mkdir -p python/datui_bin
          cp target/release/datui python/datui_bin/
          chmod +x python/datui_bin/datui
          cp LICENSE python/LICENSE

      - name: Build Python wheel (manylinux_2_28)
        run: |
          python3 scripts/packaging/wheel_manpages.py
          cd python && maturin build --release --out dist --target "$TARGET" --zig --manylinux 2_28

      - name: Collect release assets
        run: |
          mkdir -p dist
          cp target/debian/*.deb target/generate-rpm/*.rpm target/tarball/*.tar.gz python/dist/*.whl dist/
          ls -l dist

      - name: Upload linux arm64 artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: datui-linux-aarch64-artifacts
          path: dist/*

  # Proves the Linux assets on the systems they are for, before publish can run:
  # no GLIBC symbol above 2.28 and no shared library beyond glibc and libgcc_s in
  # the binary, the wheel's copy of it and the wheel's extension; then each asset
  # on Ubuntu 20.04 and 22.04, Debian 11 and 12, Rocky 8 and 9 and Amazon Linux
  # 2023, in containers, on both architectures: the tarball's binary runs and
  # reads a file, and the .deb or .rpm installs and runs, so its dependencies
  # resolve there.
  linux-gate:
    name: Linux assets on glibc 2.28 (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    needs: [linux, linux-arm64]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
            artifact: datui-linux-artifacts
          - runner: ubuntu-24.04-arm
            arch: aarch64
            artifact: datui-linux-aarch64-artifacts
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the Linux assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.artifact }}
          path: assets

      - name: Check the symbol versions and shared libraries
        run: |
          set -euo pipefail
          mkdir -p tarball wheel
          tar xzf assets/datui-v*-"$ARCH"-unknown-linux-gnu.tar.gz -C tarball
          unzip -q -o assets/datui-*.whl 'datui_bin/datui' 'datui/_datui*.so' -d wheel
          python3 scripts/packaging/check_linux_release.py symbols \
            tarball/datui wheel/datui_bin/datui wheel/datui/_datui*.so
          echo "--- deb"; dpkg-deb -f assets/datui_*.deb Package Version Architecture Depends
          echo "--- wheel"; ls assets/datui-*.whl

      - name: Run the assets on each distro
        run: python3 scripts/packaging/check_linux_release.py smoke assets

  windows:
    runs-on: windows-latest
    timeout-minutes: 100
    needs: [check-ci-passed]
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'
          cache: 'pip'
          cache-dependency-path: scripts/requirements-wheel-windows.txt

      - name: Install maturin
        run: pip install maturin

      - name: Cache cargo dependencies
        # Nightly's entry from main, restore only. See the linux job.
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: nightly
          save-if: false
          cache-workspace-crates: true

      - name: Build release binary
        run: cargo build --release --locked -p datui

      - name: Bundle CLI for wheel
        run: |
          New-Item -ItemType Directory -Force -Path python/datui_bin
          Copy-Item target/release/datui.exe python/datui_bin/
          Copy-Item LICENSE python/LICENSE

      - name: Build Python wheel
        run: |
          cd python
          maturin build --release --out dist

      - name: Create Windows zip
        # Named by the target triple, as the Linux and macOS archives are; the
        # version from Cargo.toml, as theirs. install.sh, the winget regex in
        # publish-packages.yml and [package.metadata.binstall] all know the name.
        run: |
          $version = (cargo metadata --no-deps --format-version 1 --locked | ConvertFrom-Json).packages |
            Where-Object { $_.name -eq 'datui' } | Select-Object -ExpandProperty version
          $staging = "datui-v${version}-x86_64-pc-windows-msvc"
          New-Item -ItemType Directory -Force -Path $staging
          Copy-Item target/release/datui.exe $staging/
          Copy-Item LICENSE $staging/
          # completions/ (PowerShell's _datui.ps1 among them) and man/, as every archive has
          cargo run --locked -q -p datui-cli --bin gen_docs -- dist $staging
          New-Item -ItemType Directory -Force -Path dist
          Compress-Archive -Path "$staging/*" -DestinationPath "dist/$staging.zip"
          Copy-Item python/dist/*.whl dist/
          Get-ChildItem dist

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: datui-windows-artifacts
          path: dist/*

  macos:
    runs-on: macos-latest
    timeout-minutes: 90
    needs: [check-ci-passed]
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'
          cache: 'pip'
          cache-dependency-path: scripts/requirements-wheel.txt

      - name: Install maturin
        run: pip install maturin

      - name: Cache cargo dependencies
        # Nightly's entry from main, restore only. See the linux job.
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: nightly-${{ matrix.target }}
          save-if: false
          cache-workspace-crates: true

      - name: Build release binary
        run: cargo build --release --locked -p datui --target ${{ matrix.target }}

      - name: Verify release artifacts
        run: test -f target/${{ matrix.target }}/release/datui || (echo "Release binary not found" && exit 1)

      - name: Stage and pack tarball
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          VERSION=$(cargo metadata --no-deps --format-version 1 --locked \
            | jq -r '.packages[] | select(.name == "datui") | .version')
          STAGING="datui-v${VERSION}-${TARGET}"
          mkdir -p "$STAGING" dist
          cp LICENSE "$STAGING/"
          cp "target/${TARGET}/release/datui" "$STAGING/"
          chmod +x "$STAGING/datui"
          # man/manN/ and completions/, from gen_docs built for this host
          cargo run --locked -q -p datui-cli --bin gen_docs -- dist "$STAGING"
          tar czvf "dist/$STAGING.tar.gz" -C "$STAGING" .

      - name: Bundle CLI for wheel
        run: |
          mkdir -p python/datui_bin
          cp "target/${{ matrix.target }}/release/datui" python/datui_bin/
          chmod +x python/datui_bin/datui
          cp LICENSE python/LICENSE

      - name: Build Python wheel
        run: |
          python3 scripts/packaging/wheel_manpages.py
          cd python
          maturin build --release --out dist --target ${{ matrix.target }}
          cp dist/*.whl ../dist/

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: datui-macos-${{ matrix.target }}-artifacts
          path: dist/*

  docs:
    # The documentation site for every tag plus main as dev, deployed to Pages
    # by publish. Needs no release build: mdbook, mandoc and the docs scripts.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [check-ci-passed]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable

      - name: Install system dependencies
        timeout-minutes: 5
        run: |
          # See the linux job for why `apt-get update` is allowed to fail here.
          # mandoc renders the manpages into the docs (reference/man/).
          echo 'Acquire::Retries "3"; Acquire::http::Timeout "30";' | sudo tee /etc/apt/apt.conf.d/99timeouts >/dev/null
          sudo apt-get update || echo '::warning::apt-get update reported errors; continuing'
          sudo apt-get install -y mandoc

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'
          cache: 'pip'
          cache-dependency-path: |
            scripts/requirements.txt
            scripts/requirements-fixtures.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Cache mdbook
        id: cache-mdbook
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/mdbook
          key: ${{ runner.os }}-mdbook-${{ env.MDBOOK_VERSION }}
          restore-keys: |
            ${{ runner.os }}-mdbook-

      - name: Install mdbook
        if: steps.cache-mdbook.outputs.cache-hit != 'true'
        run: cargo install mdbook --version ${{ env.MDBOOK_VERSION }} --locked --force

      - name: Compute docs cache key
        id: compute-docs-key
        run: |
          VERSION_SHA=$(git tag -l "v*" | sort -V | while read -r t; do echo "$t:$(git rev-parse "$t")"; done | sha256sum | cut -c1-16)
          echo "version_sha=$VERSION_SHA" >> "$GITHUB_OUTPUT"

      - name: Restore docs cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: book
          key: docs-book-${{ runner.os }}-${{ steps.compute-docs-key.outputs.version_sha }}
          restore-keys: |
            docs-book-${{ runner.os }}-

      - name: Build tag documentation (skip if cached for same SHA)
        run: |
          ORIGINAL_COMMIT=$(git rev-parse HEAD)
          ORIGINAL_BRANCH=$(git rev-parse --abbrev-ref HEAD)
          [ -f scripts/docs/build_single_version_docs.py ] || (echo "Error: scripts/docs/build_single_version_docs.py not found" && exit 1)
          [ -f scripts/docs/rebuild_index.py ] || (echo "Error: scripts/docs/rebuild_index.py not found" && exit 1)
          [ -f scripts/docs/index.html.j2 ] || (echo "Error: scripts/docs/index.html.j2 not found" && exit 1)
          SCRIPT_DIR="/tmp/datui-build-scripts-$$"
          mkdir -p "$SCRIPT_DIR"
          cp scripts/docs/build_single_version_docs.py "$SCRIPT_DIR/"
          cp scripts/docs/rebuild_index.py "$SCRIPT_DIR/"
          cp scripts/docs/index.html.j2 "$SCRIPT_DIR/"
          mkdir -p book
          rm -rf book/demos
          VERSION_TAGS=$(git tag -l "v*" | sort -V)
          for tag in $VERSION_TAGS; do
            TAG_SHA=$(git rev-parse "$tag")
            if [ -f "book/$tag/.built_sha" ] && [ "$(cat "book/$tag/.built_sha")" = "$TAG_SHA" ]; then
              echo "Skipping $tag (already built for this SHA)"
            else
              python3 "$SCRIPT_DIR/build_single_version_docs.py" "$tag" || true
              echo "$TAG_SHA" > "book/$tag/.built_sha"
            fi
            git checkout "$ORIGINAL_COMMIT" 2>/dev/null || git checkout "$ORIGINAL_BRANCH" 2>/dev/null || git checkout main 2>/dev/null
          done
          CURRENT_COMMIT=$(git rev-parse HEAD)
          [ "$CURRENT_COMMIT" != "$ORIGINAL_COMMIT" ] && git checkout "$ORIGINAL_COMMIT"
          rm -rf "$SCRIPT_DIR"
          python3 scripts/docs/rebuild_index.py

      # Keep /dev/ (main) in the site this deploy replaces.
      - name: Build main as dev
        run: |
          git fetch --no-tags origin main
          git worktree add --detach "$RUNNER_TEMP/main" FETCH_HEAD
          rm -rf book/dev
          (cd "$RUNNER_TEMP/main" && DATUI_REPO_ROOT="$GITHUB_WORKSPACE" \
            python3 "$GITHUB_WORKSPACE/scripts/docs/build_single_version_docs.py" dev --worktree)
          git worktree remove --force "$RUNNER_TEMP/main"
          python3 scripts/docs/rebuild_index.py

      - name: Copy latest release to latest
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          rm -rf book/latest
          cp -r "book/$REF_NAME" book/latest

      - name: Prepare Pages artifact
        run: |
          cp -r book book-deploy
          find book-deploy -name .built_sha -delete

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./book-deploy

  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [linux, linux-arm64, linux-gate, windows, macos, docs, fuzz]
    # Never on a dry run (workflow_dispatch): docs and fuzz are skipped there, so
    # this is too, and the condition says so where someone looks for it.
    if: github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Download linux artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: datui-linux-artifacts
          path: linux-x86_64

      - name: Download linux arm64 artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: datui-linux-aarch64-artifacts
          path: linux-aarch64

      - name: Download Windows artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: datui-windows-artifacts
          path: windows-x86_64

      - name: Download macOS aarch64 artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: datui-macos-aarch64-apple-darwin-artifacts
          path: macos-aarch64

      - name: Download macOS x86_64 artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: datui-macos-x86_64-apple-darwin-artifacts
          path: macos-x86_64

      # The release body has to exist at the instant the release is created.
      # publish-packages starts about a minute later and komac copies the body
      # into the winget manifest as ReleaseNotes; notes typed onto the release
      # page afterwards arrive too late, which is how 0.3.1 reached winget with
      # none. Editing the release later fixes what humans read and nothing else.
      #
      # So the body is always composed here, and is never empty. Hand-written
      # notes are preferred and live at release-notes/<tag>.md, committed with
      # the release. When that file is absent the body is generated from the
      # commit subjects since the previous tag, which is worse prose but is
      # accurate, present on time, and still editable afterwards.
      - name: Compose release body
        id: release_body
        env:
          TAG: ${{ github.ref_name }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/release-body.md"
          notes="release-notes/$TAG.md"
          if [ -s "$notes" ]; then
            cp "$notes" "$out"
            echo "Using hand-written notes from $notes"
          else
            previous=$(git describe --tags --abbrev=0 --match 'v*' "$TAG^" 2>/dev/null || true)
            if [ -n "$previous" ]; then
              range="$previous..$TAG"
            else
              range="$TAG"
            fi
            # Drop bump_version.py's own commits. "Release 0.3.1" and "Bump
            # version to 0.3.2-dev" tell a reader nothing, and would otherwise be
            # two of the three lines in a small release.
            changes=$(git log --no-merges -E --invert-grep \
              --grep='^Release [0-9]' --grep='^Bump version to ' \
              --format='- %s' "$range")
            # A release carrying nothing but version commits still needs a body.
            if [ -z "$changes" ]; then
              changes=$(git log --no-merges --format='- %s' "$range")
            fi
            {
              echo "## What's changed"
              echo
              echo "$changes"
              if [ -n "$previous" ]; then
                echo
                echo "**Full changelog**: $SERVER_URL/$REPOSITORY/compare/$previous...$TAG"
              fi
            } > "$out"
            echo "No $notes found; generated the body from commits since ${previous:-the start of history}."
            echo "Edit the release afterwards if you want better prose; winget already has this text."
          fi
          if [ ! -s "$out" ]; then
            echo "::error title=Release body is empty::Refusing to create $TAG with an empty body, which would publish to winget with no ReleaseNotes. Add release-notes/$TAG.md and re-run."
            exit 1
          fi
          echo "path=$out" >> "$GITHUB_OUTPUT"
          echo "--- release body ---"
          cat "$out"

      - name: Compute SHA256SUMS
        # Everything a user can download gets a checksum, in the standard
        # `sha256sum -c` format so no special tooling is needed to check one.
        #
        # This does not prove the artifacts came from datui: whoever could
        # replace a release asset could replace this file alongside it. What it
        # does give is integrity against a truncated or corrupted download, a
        # stable value to compare against when a mirror or a package repository
        # republishes a binary, and something for the installer to verify.
        #
        # The signature that does prove origin is applied to this file below, which is
        # why signing one file is enough to cover every artifact listed in it.
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp linux-x86_64/* linux-aarch64/* windows-x86_64/* macos-aarch64/* macos-x86_64/* release-assets/
          cd release-assets
          # Basenames only, so `sha256sum -c` works from whatever directory the
          # user downloaded into.
          sha256sum -- * > ../SHA256SUMS
          cd ..
          echo "--- SHA256SUMS ---"
          cat SHA256SUMS

      - name: Install cosign
        # SHA-pinned to defend against upstream takeover; bump deliberately.
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign SHA256SUMS
        # Signing the checksum file rather than each artifact is deliberate: it already
        # covers every downloadable by hash, so one signature carries the whole release,
        # and there is one thing for a user to verify rather than a dozen.
        #
        # Keyless, via Sigstore. There is no private key here to store as a secret, to
        # protect, to rotate, or to lose; the signing identity is this workflow's own
        # OIDC token, which is why the job needs `id-token: write` (it already has it,
        # for Pages). The signature therefore attests that this repository's release
        # workflow produced the file at this tag, which is a stronger and more checkable
        # claim than "someone holding a key did".
        #
        # The certificate is recorded in Rekor, Sigstore's public transparency log. That
        # is public information about a public release, and it is what lets anyone verify
        # without trusting us to serve them the right key.
        run: cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS

      - name: Create GitHub Release
        # SHA-pinned to defend against upstream takeover; bump deliberately.
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          body_path: ${{ steps.release_body.outputs.path }}
          files: |
            SHA256SUMS
            SHA256SUMS.sigstore.json
            release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  publish-packages:
    needs: publish
    uses: ./.github/workflows/publish-packages.yml
    with:
      tag_name: ${{ github.ref_name }}
    # Passed explicitly instead of `secrets: inherit`, so this list is the
    # complete set of credentials a release can reach.
    secrets:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
      AUR_USERNAME: ${{ secrets.AUR_USERNAME }}
      AUR_EMAIL: ${{ secrets.AUR_EMAIL }}
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
      WINGET_SYNC_TOKEN: ${{ secrets.WINGET_SYNC_TOKEN }}
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_EMAIL: ${{ secrets.GPG_EMAIL }}
      DATUI_APT_TOKEN: ${{ secrets.DATUI_APT_TOKEN }}
