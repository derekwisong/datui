# Manual workflow to test the one-line install (and on macOS and Linux, Homebrew tap install)
# across supported platforms. Uses the install script and package managers as documented
# in README.md, against the latest published release.
#
# The Linux list is the glibc floor and up: Ubuntu 20.04 (glibc 2.31, as Debian 11,
# whose archive went away at its end of life), 22.04 and the runner's 24.04,
# Debian 12, Rocky 8 (2.28, the floor itself) and 9, Amazon Linux 2023, Fedora,
# Arch, on x86_64, and Ubuntu and Debian on arm64.
name: Test Install

on:
  workflow_dispatch: {}

# Nothing here touches the repository: every job installs a published artifact
# and runs `datui --version`.
permissions: {}

env:
  INSTALL_URL: https://raw.githubusercontent.com/derekwisong/datui/main/scripts/install/install.sh

jobs:
  install-macos-oneline-homebrew:
    name: macOS ${{ matrix.arch }} (one-line + Homebrew)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    steps:
      - name: One-line install
        run: curl -fsSL "$INSTALL_URL" | sh

      - name: Verify one-line install
        run: datui --version

      - name: Remove one-line install for Homebrew test
        run: |
          sudo rm -f /usr/local/bin/datui
          sudo rm -f /usr/local/share/man/man*/datui*

      - name: Homebrew tap install
        run: |
          brew tap derekwisong/datui
          brew trust derekwisong/datui
          brew install datui

      - name: Verify Homebrew install
        run: datui --version

  install-linux-homebrew:
    name: Ubuntu 24.04 ${{ matrix.arch }} (Homebrew)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      # The x86_64 image ships Homebrew off the PATH; the arm64 one does not ship it.
      - name: Set up Homebrew
        run: |
          if [ ! -x /home/linuxbrew/.linuxbrew/bin/brew ]; then
            NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          fi
          echo /home/linuxbrew/.linuxbrew/bin >> "$GITHUB_PATH"

      - name: Homebrew tap install
        run: |
          brew tap derekwisong/datui
          brew trust derekwisong/datui
          brew install datui

      - name: Verify Homebrew install
        run: |
          datui --version
          man -w datui

  install-ubuntu-oneline:
    name: Ubuntu 24.04 ${{ matrix.arch }} (apt repository)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - name: One-line install
        run: curl -fsSL "$INSTALL_URL" | sh

      - name: Verify install
        run: datui --version

      # From 0.4.0 the archive and the deb carry every page (#705).
      - name: Verify manpages
        run: |
          man -w datui
          man -w 5 datui-config
          man -w datui-keys

  install-user:
    name: Ubuntu 24.04 (--user, no root)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: One-line install into the home directory
        run: curl -fsSL "$INSTALL_URL" | sh -s -- --user

      - name: Verify install
        run: |
          test ! -e /usr/local/bin/datui
          ~/.local/bin/datui --version
          man -w datui

  install-linux-containers:
    # Containers, as users on these releases run them; apt and dnf resolve the
    # package's dependencies against each one's glibc.
    name: ${{ matrix.image }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        image:
          - ubuntu:20.04
          - ubuntu:22.04
          - debian:12
          - rockylinux:8
          - rockylinux:9
          - amazonlinux:2023
          - fedora:42
        runner: [ubuntu-latest]
        arch: [x86_64]
        include:
          - image: ubuntu:22.04
            runner: ubuntu-24.04-arm
            arch: arm64
          - image: debian:12
            runner: ubuntu-24.04-arm
            arch: arm64
          - image: rockylinux:9
            runner: ubuntu-24.04-arm
            arch: arm64
    container:
      # Deliberately floating tags. This workflow exists to prove the
      # documented install path still works on today's distro images; a
      # digest pin would freeze it and quietly stop testing what users get.
      image: ${{ matrix.image }}  # zizmor: ignore[unpinned-images]
      options: --privileged --user 0
    steps:
      # Rocky 9 and Amazon Linux ship curl-minimal, which conflicts with the
      # curl package; any curl will do.
      - name: Install curl
        run: |
          if command -v curl > /dev/null; then
            :
          elif command -v apt-get > /dev/null; then
            apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq curl ca-certificates > /dev/null
          else
            dnf install -y -q curl
          fi

      - name: One-line install
        run: curl -fsSL "$INSTALL_URL" | sh

      - name: Verify install
        run: |
          datui --version
          command -v man > /dev/null && man -w datui || echo "no man on this image"

  install-arch-oneline:
    name: Arch Linux
    runs-on: ubuntu-latest
    timeout-minutes: 5
    container:
      # Deliberately a floating tag. This workflow exists to prove the
      # documented install path still works on today's distro image; a
      # digest pin would freeze it and quietly stop testing what users get.
      image: archlinux:latest  # zizmor: ignore[unpinned-images]
      options: --privileged --user 0
    steps:
      - name: One-line install
        run: curl -fsSL "$INSTALL_URL" | sh

      - name: Verify install
        run: datui --version

  install-arch-aur:
    name: Arch Linux (AUR datui-bin)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      # Deliberately a floating tag. This workflow exists to prove the
      # documented install path still works on today's distro image; a
      # digest pin would freeze it and quietly stop testing what users get.
      image: archlinux:latest  # zizmor: ignore[unpinned-images]
      options: --privileged --user 0
    steps:
      - name: Bootstrap Arch for AUR
        run: |
          pacman -Syu --noconfirm base-devel git sudo
          useradd -m -s /bin/bash builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

      - name: Install paru (AUR helper)
        run: |
          sudo -u builder bash -c '
            cd /tmp &&
            git clone https://aur.archlinux.org/paru.git &&
            cd paru &&
            makepkg -si --noconfirm
          '

      - name: Install datui-bin from AUR
        run: |
          sudo -u builder paru -S datui-bin --noconfirm --removemake --cleanafter

      - name: Verify AUR install
        run: datui --version

  install-pip:
    name: pip (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-14, windows-latest]
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'

      - name: Install the wheel
        run: pip install datui

      - name: Verify install
        run: |
          datui --version
          python -c "import datui; print(datui.PAIRED_POLARS)"
