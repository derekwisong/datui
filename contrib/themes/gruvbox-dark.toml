# Gruvbox dark, as a datui theme.
#
# Palette: gruvbox by Pavel Pertsev (morhetz), https://github.com/morhetz/gruvbox,
# MIT license, Copyright (c) 2012 Pavel Pertsev. The mapping onto datui's slots
# is datui's, under its MIT license.
#
# Copy into themes/ in the config directory (`datui config path` shows where)
# and pick it with `theme.dark = "gruvbox-dark"`. Best on a terminal whose
# background is Gruvbox's #282828.

extends = "night-market"
description = "Gruvbox dark, with a yellow accent"

