name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# This kills redundant builds if you push multiple times to the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Cancel superseded runs on a pull request, never on main. Pushing twice to a
  # branch should not build it twice; merging twice in quick succession leaves
  # main with cancelled runs, and a cancelled run reads as a failed one on the
  # README badge and in the branch history.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Incremental compilation only pays off across repeated local edits. In CI every
  # job starts from a restored cache and builds once, so it is pure overhead: it
  # slows compilation and inflates target/ (and therefore the cache) for nothing.
  CARGO_INCREMENTAL: "0"

# Cache policy. rust-cache saves only from main: an entry written on a pull request
# is readable by that pull request alone, and those entries pushed main's out of the
# 10 GB budget. A pull request restores main's entry for its job. Each job variant
# has its own shared-key: rust-cache names an entry by that key, the runner OS and
# arch, the toolchain, CARGO*/RUST* env and the lockfile, so two jobs that build
# different things under one key race to save it and one restores the other's
# build. Workspace crates are left out of the cache (no cache-workspace-crates):
# they change on every pull request. No sccache: most of what datui compiles is a
# crate type it cannot cache, and its entries took budget for a handful of hits.
# No setup-python pip cache either: it saves whenever its key misses, pull requests
# included, and restoring it took longer than pip downloading the wheels.

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      is_dev_version: ${{ steps.version.outputs.is_dev_version }}
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set dev version output
        id: version
        run: |
          VERSION=$(sed -n '/^\[package\]/,/^\[/p' Cargo.toml | grep -E '^\s*version\s*=' | head -1 | sed 's/.*"\([^"]*\)".*/\1/')
          if [[ "$VERSION" == *-dev ]]; then
            echo "is_dev_version=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_dev_version=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust
        uses: ./.github/actions/setup
      - name: Install system dependencies
        timeout-minutes: 5
        run: |
          # The runner image ships third-party apt repositories datui does not use (Chrome, for one).
          # When one of those serves a bad index, `apt-get update` exits non-zero and fails a build
          # that had nothing to do with it. The install below is the real gate: if Ubuntu's own
          # indexes did not fetch, it fails there, for the right reason. A stalled mirror
          # gets 30s per connection and three retries, and the step five minutes, so a
          # hang fails here rather than holding the job until its own timeout.
          echo 'Acquire::Retries "3"; Acquire::http::Timeout "30";' | sudo tee /etc/apt/apt.conf.d/99timeouts >/dev/null
          sudo apt-get update || echo '::warning::apt-get update reported errors; continuing'
          sudo apt-get install -y pkg-config

      - name: Cache cargo dependencies
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: clippy
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check formatting
        run: ./scripts/code/check_format.sh

      - name: Run clippy
        run: ./scripts/code/check_clippy.sh

  # Every other job builds the default features, so code that only compiles or lints
  # cleanly with them goes unnoticed (#481). Clippy with --all-targets covers the tests
  # too. Its own job and cache key: a second polars feature set would double the check
  # job's cache, and run in parallel it adds nothing to the wait. Each feature alone is
  # the Nightly workflow's job.
  no-default-features:
    name: No default features
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: ./.github/actions/setup

      - name: Install system dependencies
        timeout-minutes: 5
        run: |
          echo 'Acquire::Retries "3"; Acquire::http::Timeout "30";' | sudo tee /etc/apt/apt.conf.d/99timeouts >/dev/null
          sudo apt-get update || echo '::warning::apt-get update reported errors; continuing'
          sudo apt-get install -y pkg-config

      - name: Cache cargo dependencies
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: no-default-features
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run clippy without default features
        run: ./scripts/dev/test.sh features none

  # The fuzz crate is its own workspace, so nothing else here compiles it. A check
  # keeps the targets building; the corpus itself replays in the test suite
  # (tests/fuzz_corpus_test.rs), and the Nightly workflow does the fuzzing.
  fuzz:
    name: Fuzz targets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: ./.github/actions/setup

      - name: Install system dependencies
        timeout-minutes: 5
        run: |
          echo 'Acquire::Retries "3"; Acquire::http::Timeout "30";' | sudo tee /etc/apt/apt.conf.d/99timeouts >/dev/null
          sudo apt-get update || echo '::warning::apt-get update reported errors; continuing'
          sudo apt-get install -y pkg-config

      # Its own key: fuzz/Cargo.lock is a separate lockfile.
      - name: Cache cargo dependencies
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: fuzz-check
          workspaces: fuzz
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check
        run: cargo check --manifest-path fuzz/Cargo.toml --locked

  # Build with the oldest Rust the manifests declare, so a newer language feature or
  # std API cannot creep in unnoticed. A check is enough: the pinned toolchain runs
  # clippy and the tests above; this job only proves the tree still compiles at the floor.
  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read rust-version from Cargo.toml
        id: msrv
        run: |
          VERSION=$(sed -n '/^\[package\]/,/^\[/p' Cargo.toml | grep -E '^\s*rust-version\s*=' | head -1 | sed 's/.*"\([^"]*\)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        uses: ./.github/actions/setup
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - name: Install system dependencies
        timeout-minutes: 5
        run: |
          echo 'Acquire::Retries "3"; Acquire::http::Timeout "30";' | sudo tee /etc/apt/apt.conf.d/99timeouts >/dev/null
          sudo apt-get update || echo '::warning::apt-get update reported errors; continuing'
          sudo apt-get install -y pkg-config

      # Its own cache key: artifacts from a different compiler are not shareable.
      # RUSTUP_TOOLCHAIN here and below: rust-toolchain.toml outranks `rustup default`,
      # and rust-cache keys the entry on the rustc it finds.
      - name: Cache cargo dependencies
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.msrv.outputs.version }}
        with:
          shared-key: msrv
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.msrv.outputs.version }}
        run: cargo check --workspace --locked

  # No `needs: [check]`: nothing passes between the two, so waiting on clippy only
  # added its minute to every run.
  linux:
    runs-on: ubuntu-latest
    # Cold, this builds Polars from scratch: about 20 minutes.
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show disk space before build
        run: df -h

      - name: Install Rust
        uses: ./.github/actions/setup

      - name: Install system dependencies
        timeout-minutes: 5
        run: |
          echo 'Acquire::Retries "3"; Acquire::http::Timeout "30";' | sudo tee /etc/apt/apt.conf.d/99timeouts >/dev/null
          sudo apt-get update || echo '::warning::apt-get update reported errors; continuing'
          sudo apt-get install -y pkg-config

      - name: Cache cargo dependencies
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: tests
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # A prebuilt binary, checksum-verified by the action, rather than minutes of
      # `cargo install` on a cold cache.
      - name: Install cargo-nextest
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-nextest

      # The fixtures are cached under a key holding every input to the generator:
      #   - scripts/generate_sample_data.py, which reads no other file
      #   - scripts/requirements-fixtures.txt: every package it imports, and what
      #     those pull in, at exact versions
      #   - the Python version setup-python resolved, and the runner OS and arch
      #   - sample-data-v1, a schema version to bump by hand to discard them all
      # No restore-keys: a near match is a stale one. A restore is checked against
      # the manifest saved with it (every file name and SHA-256) and regenerated if
      # anything differs. Saved from main only, before the tests run.
      - name: Set up Python
        id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'

      - name: Restore sample data
        id: sample-data
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            tests/sample-data
            ${{ runner.temp }}/sample-data.sha256
          key: sample-data-v1-${{ runner.os }}-${{ runner.arch }}-py${{ steps.python.outputs.python-version }}-${{ hashFiles('scripts/generate_sample_data.py', 'scripts/requirements-fixtures.txt') }}

      - name: Verify restored sample data
        id: verify
        if: steps.sample-data.outputs.cache-hit == 'true'
        run: |
          (cd tests/sample-data && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum) > "$RUNNER_TEMP/sample-data.actual"
          if [ -s "$RUNNER_TEMP/sample-data.sha256" ] && cmp -s "$RUNNER_TEMP/sample-data.sha256" "$RUNNER_TEMP/sample-data.actual"; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Restored sample data does not match its manifest; regenerating"
            diff "$RUNNER_TEMP/sample-data.sha256" "$RUNNER_TEMP/sample-data.actual" || true
          fi

      # The venv exists only for the generator. With the fixtures in place the tests
      # never start Python.
      - name: Generate sample data
        id: generate
        if: steps.verify.outputs.ok != 'true'
        run: |
          rm -rf tests/sample-data
          python -m venv .venv
          .venv/bin/pip install --disable-pip-version-check -r scripts/requirements-fixtures.txt
          .venv/bin/python scripts/generate_sample_data.py
          (cd tests/sample-data && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum) > "$RUNNER_TEMP/sample-data.sha256"

      - name: Save sample data
        if: steps.generate.outcome == 'success' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            tests/sample-data
            ${{ runner.temp }}/sample-data.sha256
          key: ${{ steps.sample-data.outputs.cache-primary-key }}

      - name: Build
        run: cargo nextest run --workspace --locked --no-run

      # nextest runs each test in its own process, every binary at once. The
      # fixtures are in place by now: a test that generated them itself would
      # rewrite files other processes have mapped. --no-fail-fast so one failure
      # does not hide the others; no retries, so a flaky test fails.
      - name: Run tests
        run: cargo nextest run --workspace --locked --no-fail-fast

      # nextest does not run doctests.
      - name: Run doctests
        run: cargo test --doc --workspace --locked

      - name: Verify binary exists
        run: test -f target/debug/datui || (echo "Binary not found" && exit 1)

      - name: Show disk space after build
        run: df -h

  # The Python lane, beside linux rather than after it: the docs scripts' tests, and
  # the wheel built and tested with the CLI it bundles. The CLI is built here with
  # `-p datui`, the feature set that ships. Nothing comes over from linux: waiting
  # for its artifact would put this lane back on the critical path.
  python:
    name: Python
    runs-on: ubuntu-latest
    # Cold, this builds Polars for the CLI and again for the extension.
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: ./.github/actions/setup

      - name: Install system dependencies
        timeout-minutes: 5
        run: |
          echo 'Acquire::Retries "3"; Acquire::http::Timeout "30";' | sudo tee /etc/apt/apt.conf.d/99timeouts >/dev/null
          sudo apt-get update || echo '::warning::apt-get update reported errors; continuing'
          # mandoc and groff lint the manpages; man-db's lexgrog reads their NAME lines.
          sudo apt-get install -y pkg-config python3-dev mandoc groff-base man-db

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'

      # The CLI and the extension build into one target/. The key hashes the root
      # Cargo.lock only, so a change to crates/datui-pyo3/Cargo.lock alone rebuilds
      # what moved until a root lockfile or toolchain change saves a fresh entry.
      - name: Cache cargo dependencies
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: python
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Create virtual environment and install requirements
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -r scripts/requirements.txt
          .venv/bin/pip install -r scripts/requirements-wheel.txt

      - name: Test documentation navigation and builds
        run: .venv/bin/python -m unittest discover -s scripts/docs -p 'test_*.py'

      - name: Test the capture harness
        run: .venv/bin/python -m unittest discover -s scripts/demos -p 'test_*.py'

      # The book's structure, and every code block labeled runnable, template or
      # output (#683).
      - name: Lint the docs
        run: |
          .venv/bin/python scripts/docs/lint_docs.py
          .venv/bin/python scripts/docs/doc_examples.py --lint

      # Zero mandoc and groff warnings, at 78 and 60 columns, and a NAME line whatis
      # reads (#705). The pages' sections and completeness are datui-cli's tests.
      - name: Lint the manpages
        run: .venv/bin/python scripts/docs/lint_manpages.py --require

      - name: Build CLI
        run: cargo build -p datui --locked

      # Every runnable block and example that needs no network, run as a reader would
      # run it. The network ones run in Nightly.
      - name: Run the docs' examples
        run: .venv/bin/python scripts/docs/doc_examples.py --bin target/debug/datui

      - name: Bundle CLI for wheel
        run: |
          mkdir -p python/datui_bin
          mv target/debug/datui python/datui_bin/
          chmod +x python/datui_bin/datui
          cp LICENSE python/LICENSE

      - name: Build and install Python package
        run: . .venv/bin/activate && cd python && maturin develop

      - name: Run Python tests
        run: . .venv/bin/activate && pytest python/tests/ -v

      - name: Run the docs' Python examples
        run: .venv/bin/python scripts/docs/doc_examples.py --python

  # Windows on every pull request: the build, the library and binary tests, and the
  # binary run without a terminal. The full suite stays on the windows job below
  # (release versions) and on Nightly; its integration test executables each link
  # Polars, which is most of that job's hour. No `needs`, like linux.
  windows-pr:
    name: Windows build and unit tests
    runs-on: windows-latest
    # Cold, the build alone took 24 minutes.
    timeout-minutes: 60
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: ./.github/actions/setup

      # Its own key rather than Nightly's `tests`: that job builds every test
      # executable, more than this one needs, and has run past its timeout without
      # saving. Saved from main, like the others.
      - name: Cache cargo dependencies
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: windows-pr
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The fixtures as linux caches them, under a Windows key: see that job.
      - name: Set up Python
        id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'

      - name: Restore sample data
        id: sample-data
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            tests/sample-data
            ${{ runner.temp }}/sample-data.sha256
          key: sample-data-v1-${{ runner.os }}-${{ runner.arch }}-py${{ steps.python.outputs.python-version }}-${{ hashFiles('scripts/generate_sample_data.py', 'scripts/requirements-fixtures.txt') }}

      - name: Verify restored sample data
        id: verify
        if: steps.sample-data.outputs.cache-hit == 'true'
        shell: bash
        run: |
          (cd tests/sample-data && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum) > "$RUNNER_TEMP/sample-data.actual"
          if [ -s "$RUNNER_TEMP/sample-data.sha256" ] && cmp -s "$RUNNER_TEMP/sample-data.sha256" "$RUNNER_TEMP/sample-data.actual"; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Restored sample data does not match its manifest; regenerating"
            diff "$RUNNER_TEMP/sample-data.sha256" "$RUNNER_TEMP/sample-data.actual" || true
          fi

      - name: Generate sample data
        id: generate
        if: steps.verify.outputs.ok != 'true'
        shell: bash
        run: |
          rm -rf tests/sample-data
          python -m venv .venv
          .venv/Scripts/python.exe -m pip install --disable-pip-version-check -r scripts/requirements-fixtures.txt
          .venv/Scripts/python.exe scripts/generate_sample_data.py
          (cd tests/sample-data && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum) > "$RUNNER_TEMP/sample-data.sha256"

      - name: Save sample data
        if: steps.generate.outcome == 'success' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            tests/sample-data
            ${{ runner.temp }}/sample-data.sha256
          key: ${{ steps.sample-data.outputs.cache-primary-key }}

      # The binary for the smoke run, then the tests: `--bins` builds the binary's
      # test harness, not the binary.
      - name: Build
        run: |
          cargo build --locked --bin datui
          cargo test --workspace --locked --lib --bins --no-run

      - name: Run unit tests
        run: cargo test --workspace --locked --lib --bins --no-fail-fast

      # The runner has a console, so datui takes it, reads its settings and starts the
      # open; a file that is not there ends the run with its name, as it does without
      # a console. Enough to see the binary start and expand a `~\` that cmd and older
      # PowerShell pass on as typed. A file that is there would wait for keys.
      - name: Smoke run
        timeout-minutes: 2
        shell: bash
        run: |
          exe=target/debug/datui.exe
          version=$("$exe" --version) || { echo "::error::--version failed"; exit 1; }
          echo "$version"
          [[ "$version" == datui\ * ]] || { echo "::error::--version said: $version"; exit 1; }
          expect_exit_1() {
            local said status
            said=$(timeout 60 "$exe" "$1" 2>&1 </dev/null) && status=0 || status=$?
            echo "$said"
            [ "$status" -eq 1 ] || { echo "::error::$1 exited $status"; exit 1; }
            grep -qF -- "$2" <<<"$said" || { echo "::error::$1 did not say: $2"; exit 1; }
          }
          expect_exit_1 datui-no-such-file.csv "File not found: datui-no-such-file.csv"
          expect_exit_1 '~\datui-no-such-file.csv' "File not found: $USERPROFILE\\datui-no-such-file.csv"

  windows:
    runs-on: windows-latest
    needs: [check]
    if: needs.check.outputs.is_dev_version != 'true'
    timeout-minutes: 120
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: ./.github/actions/setup

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'

      # Nightly's windows-tests and macos-tests keep this entry warm from main; keep
      # their env and key in step with these jobs.
      - name: Cache cargo dependencies
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: tests
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Create virtual environment and install requirements
        run: |
          python -m venv .venv
          .venv\Scripts\python.exe -m pip install --upgrade pip
          .venv\Scripts\pip.exe install -r scripts/requirements.txt
          .venv\Scripts\pip.exe install -r scripts/requirements-wheel-windows.txt

      - name: Generate sample data
        run: .venv\Scripts\python.exe scripts/generate_sample_data.py

      - name: Build
        run: cargo build --workspace --tests --locked

      - name: Run tests
        # --no-fail-fast so one failing test binary does not hide the others. The
        # macOS and Windows jobs only run on a release version, so a round trip here
        # costs a re-tag, not a re-push -- finding every failure in one run matters.
        run: cargo test --workspace --locked --no-fail-fast

      - name: Verify binary exists
        run: |
          if (!(Test-Path target\debug\datui.exe)) { Write-Error "Binary not found"; exit 1 }

      - name: Bundle CLI for wheel
        run: |
          New-Item -ItemType Directory -Force -Path python/datui_bin
          Move-Item target/debug/datui.exe python/datui_bin/
          Copy-Item LICENSE python/LICENSE

      - name: Build and install Python package
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          .\.venv\Scripts\Activate.ps1
          cd python
          maturin develop

      - name: Run Python tests
        run: |
          .\.venv\Scripts\Activate.ps1
          pytest python/tests/ -v

  macos:
    runs-on: macos-latest
    needs: [check]
    if: needs.check.outputs.is_dev_version != 'true'
    timeout-minutes: 60
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: ./.github/actions/setup

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'

      # Nightly's windows-tests and macos-tests keep this entry warm from main; keep
      # their env and key in step with these jobs.
      - name: Cache cargo dependencies
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: tests
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Create virtual environment and install requirements
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -r scripts/requirements.txt
          .venv/bin/pip install -r scripts/requirements-wheel.txt

      - name: Generate sample data
        run: .venv/bin/python scripts/generate_sample_data.py

      - name: Build
        run: cargo build --workspace --tests --locked

      - name: Run tests
        # --no-fail-fast so one failing test binary does not hide the others. The
        # macOS and Windows jobs only run on a release version, so a round trip here
        # costs a re-tag, not a re-push -- finding every failure in one run matters.
        run: cargo test --workspace --locked --no-fail-fast

      - name: Verify binary exists
        run: test -f target/debug/datui || (echo "Binary not found" && exit 1)

      - name: Bundle CLI for wheel
        run: |
          mkdir -p python/datui_bin
          mv target/debug/datui python/datui_bin/
          chmod +x python/datui_bin/datui
          cp LICENSE python/LICENSE

      - name: Build and install Python package
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: . .venv/bin/activate && cd python && maturin develop

      - name: Run Python tests
        run: . .venv/bin/activate && pytest python/tests/ -v

  # One context for the branch ruleset to require. The jobs above cannot be required
  # directly: windows and macos are skipped on a -dev version, and a required check
  # that never reports blocks the pull request forever rather than failing it. This
  # job always runs, so it always reports. It fails closed: every job must succeed,
  # except that windows and macos may be skipped when check says the version is a
  # -dev one. A failure, a cancellation, a timeout or any other skip fails it.
  #
  # Note this gates the CI workflow only. A job cannot wait on another workflow's
  # jobs, so Security's contexts (cargo-deny, zizmor) are required separately.
  ci-passed:
    name: CI passed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [check, no-default-features, fuzz, msrv, linux, python, windows-pr, windows, macos]
    if: always()
    steps:
      - name: Check that every job passed or was skipped as intended
        # Through env, not interpolated into the script: every expansion in a `run:`
        # block is one zizmor flags, and the habit is worth more than the exception.
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          results=$(jq -r 'to_entries[] | "\(.key) \(.value.result)"' <<<"$NEEDS")
          dev=$(jq -r '.check.outputs.is_dev_version // ""' <<<"$NEEDS")
          echo "$results"
          [ -n "$results" ] || { echo "::error::No job results"; exit 1; }
          failed=0
          while read -r job result; do
            case "$job:$result" in
              *:success) ;;
              windows:skipped|macos:skipped)
                [ "$dev" = "true" ] || { echo "::error::$job was skipped, but check did not report a -dev version"; failed=1; } ;;
              *) echo "::error::$job reported '$result'"; failed=1 ;;
            esac
          done <<<"$results"
          exit "$failed"
