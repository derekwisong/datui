[package]
name = "datui-lib"
version = "0.4.0-dev"
edition = "2024"
rust-version = "1.95"
description = "Data Exploration in the Terminal (library)"
authors = ["Derek Wisong"]
homepage = "https://derekwisong.github.io/datui"
repository = "https://github.com/derekwisong/datui"
license = "MIT"
readme = "README.md"
keywords = ["cli", "tui", "data", "utility", "analysis"]
categories = ["command-line-utilities", "science"]

[lib]
path = "src/lib.rs"

[features]
default = ["cloud", "http", "sql", "streaming"]
cloud = ["polars/aws", "polars/azure", "polars/gcp", "dep:object_store", "dep:quick-xml", "dep:ureq", "dep:http", "dep:futures"]
http = ["dep:ureq"]
sql = ["polars/sql", "dep:polars-sql", "dep:sqlparser"]
streaming = ["polars/streaming"]

[dependencies]
datui-cli = { path = "../datui-cli", version = "0.4.0-dev" }
clap = { version = "4.5.54", features = ["derive"] }
color-eyre = "0.6.5"
crossterm = "0.29.0"
dirs = "7.0"
fs2 = "0.4"
globset = "0.4"
ratatui = { version = "0.30.0", features = ["all-widgets"] }
unicode-width = "0.2"
regex = "1.10"
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
supports-color = "3.0"
toml = "1.1"
bzip2 = "0.6"
xz2 = "0.1"
flate2 = "1.0"
zstd = "0.14"
plotters = "0.3"
calamine = { version = "0.36", features = ["chrono"] }
orc-rust = "0.9"
arrow = "59"
tempfile = "3.14"
ureq = { version = "3.4", optional = true }
object_store = { version = "0.13.1", optional = true, default-features = false, features = ["aws", "azure", "gcp"] }
# S3 ListBuckets answers in XML, from an endpoint the user pointed datui at and does
# not necessarily control. 0.41 is the first release past the two denial-of-service
# advisories against the 0.38 line, and it is already in the tree behind calamine.
quick-xml = { version = "0.42", optional = true }
# The request type object_store's SigV4 authorizer signs. Pulled in directly rather
# than reached through object_store, whose own re-export is of an internal module of
# the same name, not of this crate.
http = { version = "1", optional = true }
# Already in the tree through object_store; used for its stream helpers.
futures = { version = "0.3", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "rt", "io-util", "sync"] }
# The system clipboard for the copy dialog. `wayland-data-control` is not
# negotiable: without it arboard writes the XWayland clipboard, which
# Wayland-native pastes never see. Default features off to leave the
# image-data flavor (and the image crate) out.
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
# OSC 52 payloads; already in the tree transitively.
base64 = "0.23"
polars-sql = { version = "0.55", optional = true }
# The parser polars-sql uses, at its version: reads a GROUP BY statement to drill into.
sqlparser = { version = "0.62", optional = true, features = ["visitor"] }
ignore = "0.4.33"
# The log facade, for the log file. Already in the tree through Polars and ureq.
log = "0.4"
# Where `polars_warn!` goes (`set_warning_function`); Polars' own error crate.
polars-error = "0.55"

# Pointing fd 2 at the log while the TUI owns the terminal. Already in the tree.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dependencies.polars]
version = "0.55"
default-features = false
features = [
    "avro",
    "csv",
    "decompress",
    # Not optional despite looking it: render/home_view.rs matches on
    # `DataType::Decimal` unconditionally. It used to arrive only as a transitive
    # dependency of `polars/sql`, so every build without the `sql` feature failed to
    # compile.
    "dtype-decimal",
    # The same for `DataType::Array`, which schema_union.rs matches on; it arrived
    # only through `polars/streaming` or `polars/sql`.
    "dtype-array",
    "dtype-datetime",
    "dtype-time",
    "dtype-duration",
    "ipc",
    # Key-like columns drill in to the rows whose value is not the only one of its
    # kind, which is `is_duplicated` and nothing else expresses in one pass.
    "is_unique",
    "json",
    "lazy",
    "parquet",
    "polars-io",
    "pivot",
    "temporal",
    "timezones",
    "month_start",
    "month_end",
    "coalesce",
    "regex",
    "abs",
    "round_series",
    # log and exp in the q-style query language.
    "log",
    "strings",
]
# "sql" enabled via optional feature sql = ["polars/sql", "dep:polars-sql", "dep:sqlparser"]

[dependencies.polars-parquet]
version = "0.55"
default-features = false

# Polars' JSON writer, for list and struct cells written into a CSV or a copy:
# the same text NDJSON export produces, without a lazy round trip per copy.
[dependencies.polars-json]
version = "0.55"
default-features = false

# Polars' Avro schema and serializers, already in the tree through polars/avro:
# its `AvroWriter` cannot name fields apart from the columns or keep a doc.
[dependencies.polars-arrow]
version = "0.55"
default-features = false
features = ["io_avro"]

[dev-dependencies]
tempfile = "3.8"
criterion = "0.8"

[[bench]]
name = "numfmt"
harness = false
