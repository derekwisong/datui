[book]
title = "Datui"
authors = [
    "Derek Wisong"
]
description = "Terminal user interface for exploring and analyzing data files"
language = "en"
src = "docs"

[build]
build-dir = "book"

[output.html]
default-theme = "navy"
preferred-dark-theme = "navy"
additional-css = ["docs/night-market.css"]
git-repository-url = "https://github.com/derekwisong/datui"
edit-url-template = "https://github.com/derekwisong/datui/edit/main/{path}"

[output.html.fold]
enable = true
level = 1

[output.html.search]
enable = true
limit-results = 30
teaser-word-count = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1
expand = true
heading-split-level = 3

[output.html.redirect]
"/getting-started.html" = "introduction.html"
"/user-guide.html" = "introduction.html"
"/reference.html" = "introduction.html"
"/for-developers/setup-script.html" = "contributing.html#setup"
"/for-developers/pypi-deployment.html" = "packaging.html#pypi"
"/user-guide/configuration.html#sections" = "configuration.html#find-a-setting"
"/user-guide/configuration.html#file-loading" = "../reference/settings.html#file-loading"
"/user-guide/configuration.html#display" = "../reference/settings.html#display"
"/user-guide/configuration.html#number-formatting" = "../reference/settings.html#number-formatting"
"/user-guide/configuration.html#performance" = "../reference/settings.html#performance"
"/user-guide/configuration.html#charts" = "../reference/settings.html#charts"
"/user-guide/configuration.html#data" = "../reference/settings.html#data"
"/user-guide/configuration.html#cloud" = "../reference/cloud-sources.html"
"/user-guide/configuration.html#secrets-that-live-elsewhere" = "../reference/cloud-sources.html#secrets-from-files-and-commands"
"/user-guide/configuration.html#query-views-debug" = "../reference/settings.html#query-views-debug"
"/user-guide/configuration.html#theme" = "../reference/settings.html#theme"
"/user-guide/configuration.html#light-and-dark" = "../reference/settings.html#light-and-dark"
"/user-guide/configuration.html#colors" = "../reference/settings.html#colors"
"/user-guide/configuration.html#clipboard" = "../reference/settings.html#clipboard"
