# The datasets the docs' queries run against (`sql,dataset=NAME`, `q,dataset=NAME`).
# A `url` is public data from the built-in catalog, downloaded by
# `doc_examples.py --fetch-datasets DIR` for the nightly job; a `path` ships with the
# docs and runs on every pull request.

