# cargo-deny configuration for datui.
# Run locally with: cargo deny check
# CI runs the same checks in .github/workflows/security.yml.

[graph]
# Only audit the platforms we actually ship binaries for. Without this,
# cargo-deny pulls in advisories and licenses for crates that never get
# compiled into a datui release (e.g. redox, wasm).
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-unknown-linux-gnu" },
    { triple = "x86_64-apple-darwin" },
    { triple = "aarch64-apple-darwin" },
    { triple = "x86_64-pc-windows-msvc" },
]
all-features = true

[advisories]
version = 2
# Every entry below is a debt, not a decision. Each one records why it is not
# fixed today and what event should clear it. Review this list whenever
# Dependabot lands a dependency bump.
ignore = [
    # quick-xml 0.38, two denial-of-service bugs: quadratic parsing of duplicate
    # attribute names, and unbounded namespace allocation. Patched in 0.41.
    #
    # These were the highest-priority entries in this file while calamine held
    # quick-xml at 0.38, because that put them on the .xlsx path, where the
    # input is whatever spreadsheet the user opened. calamine 0.36 moved to
    # quick-xml 0.41 and closed that path.
    #
    # What is left is a second copy of 0.38 pulled in by object_store, which
    # uses it to parse the XML that S3 and GCS return. Reaching it means
    # pointing datui at an object-store endpoint that answers with hostile XML,
    # so it needs a malicious or compromised endpoint the user chose, rather
    # than a file they opened. Worst case is still a hang or an OOM kill, not
    # memory corruption.
    #
    # No upgrade is available: polars 0.52 pins object_store 0.12, so raising
    # datui's own object_store dependency would add a second copy and leave the
    # vulnerable one in the tree behind polars.
    # Clears when: polars bumps object_store to a release built on quick-xml
    # 0.41 or later.
    { id = "RUSTSEC-2026-0194", reason = "quick-xml DoS; xlsx path fixed by calamine 0.36, remaining copy is object_store S3/GCS XML, pinned by polars" },
    { id = "RUSTSEC-2026-0195", reason = "quick-xml DoS; xlsx path fixed by calamine 0.36, remaining copy is object_store S3/GCS XML, pinned by polars" },

    # --- Unmaintained, no known vulnerability ---

    # ttf-parser, via plotters, used to lay out text when exporting a chart to
    # an image. It parses font files from the system, not from the dataset, so
    # it is not on the untrusted-data path. No safe upgrade exists: plotters
    # would have to move to skrifa.
    # Clears when: plotters releases a version off ttf-parser.
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser unmaintained; via plotters, parses system fonts only, no upgrade available" },

    # bincode 2, via polars-utils. Unmaintained, no advisory against the code.
    # Note that datui-pyo3 also uses bincode directly to decode LazyFrame plans;
    # that is tracked as a trust-boundary question, not as this advisory.
    # Clears when: polars moves off bincode, or bincode finds a maintainer.
    { id = "RUSTSEC-2025-0141", reason = "bincode unmaintained; transitive via polars-utils" },


    # rustls-pemfile, via object_store, on the S3/GCS path. Unmaintained, no
    # advisory against the code; the functionality moved into rustls-pki-types.
    # Clears when: object_store updates.
    { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile unmaintained; transitive via object_store" },
]

[licenses]
version = 2
# Licenses accepted in the dependency tree. datui itself is MIT.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "Unlicense",
    "BSL-1.0",
    # webpki-roots: the Mozilla CA certificate bundle. A permissive data
    # license, not a code license, and unavoidable for anything doing TLS.
    "CDLA-Permissive-2.0",
    # libbz2-rs-sys, reached through bzip2 0.6. The original bzip2 licence:
    # BSD-style, permissive, and the same terms the C libbz2 always shipped
    # under. It appears in the tree now only because bzip2 0.6 replaced the C
    # library with a pure-Rust implementation, which is a straight improvement
    # on a path that parses untrusted input.
    "bzip2-1.0.6",
    # libfuzzer-sys, in the fuzz/ workspace. NCSA is the University of
    # Illinois/NCSA Open Source License, which LLVM used before relicensing;
    # libFuzzer itself is still under it. Permissive and BSD-shaped. It reaches
    # only the fuzz targets, which are a development tool and are never
    # published or shipped in a binary.
    "NCSA",
]
confidence-threshold = 0.8

[bans]
# Two copies of one crate is a smell, not a vulnerability: it means some path is
# pinned to an old version that has stopped getting security fixes. Warn.
multiple-versions = "warn"
# A wildcard version requirement means whoever takes over that crate can ship us
# anything on the next `cargo update`.
wildcards = "deny"
allow-wildcard-paths = true
deny = []

[sources]
# Everything must come from crates.io. An unknown registry or a git dependency
# is code entering the build from outside the audited supply chain.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
