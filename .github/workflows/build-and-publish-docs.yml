# Build and publish documentation for all versions, latest, and main as /dev/.
# Runs on every push to main that touches the docs, so the next release's manual is
# reviewable at /dev/ before the tag; run it by hand to rebuild without a release.
# Uses the same cache key as release.yml so cached book/ from releases can be reused.

name: Build and publish docs

# Read-only by default. The `deploy-pages` job grants itself pages/id-token;
# the build job that runs mdbook and the docs scripts does not need them.
permissions:
  contents: read

on:
  workflow_dispatch: {}
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'book.toml'
      - 'demos/**'
      - 'crates/datui-cli/man/**'
      - 'scripts/docs/**'
      - '.github/workflows/build-and-publish-docs.yml'

# One deploy at a time; a newer push waits rather than racing the older one's deploy.
concurrency:
  group: pages-docs
  cancel-in-progress: false

env:
  MDBOOK_VERSION: "0.5.2"

jobs:
  build-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'
          cache: 'pip'
          cache-dependency-path: |
            scripts/requirements.txt
            scripts/requirements-fixtures.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Install mandoc
        # Renders the manpages into each book's reference/man/.
        timeout-minutes: 5
        run: |
          sudo apt-get update || echo '::warning::apt-get update reported errors; continuing'
          sudo apt-get install -y mandoc

      - name: Install Rust (for mdbook when not cached)
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
      - name: Cache mdbook
        id: cache-mdbook
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/mdbook
          key: ${{ runner.os }}-mdbook-${{ env.MDBOOK_VERSION }}
          restore-keys: |
            ${{ runner.os }}-mdbook-

      - name: Install mdbook
        if: steps.cache-mdbook.outputs.cache-hit != 'true'
        run: cargo install mdbook --version ${{ env.MDBOOK_VERSION }} --locked --force

      - name: Compute docs cache key
        id: compute-docs-key
        run: |
          VERSION_SHA=$(git tag -l "v*" | sort -V | while read t; do echo "$t:$(git rev-parse "$t")"; done | sha256sum | cut -c1-16)
          echo "version_sha=$VERSION_SHA" >> "$GITHUB_OUTPUT"

      - name: Restore docs cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: book
          key: docs-book-${{ runner.os }}-${{ steps.compute-docs-key.outputs.version_sha }}
          restore-keys: |
            docs-book-${{ runner.os }}-

      - name: Build tag documentation (skip if cached for same SHA)
        run: |
          ORIGINAL_COMMIT=$(git rev-parse HEAD)
          ORIGINAL_BRANCH=$(git rev-parse --abbrev-ref HEAD)
          [ -f scripts/docs/build_single_version_docs.py ] || (echo "Error: scripts/docs/build_single_version_docs.py not found" && exit 1)
          [ -f scripts/docs/rebuild_index.py ] || (echo "Error: scripts/docs/rebuild_index.py not found" && exit 1)
          [ -f scripts/docs/index.html.j2 ] || (echo "Error: scripts/docs/index.html.j2 not found" && exit 1)
          SCRIPT_DIR="/tmp/datui-build-scripts-$$"
          mkdir -p "$SCRIPT_DIR"
          cp scripts/docs/build_single_version_docs.py "$SCRIPT_DIR/"
          cp scripts/docs/rebuild_index.py "$SCRIPT_DIR/"
          cp scripts/docs/index.html.j2 "$SCRIPT_DIR/"
          mkdir -p book
          rm -rf book/demos
          VERSION_TAGS=$(git tag -l "v*" | sort -V)
          for tag in $VERSION_TAGS; do
            TAG_SHA=$(git rev-parse "$tag")
            if [ -f "book/$tag/.built_sha" ] && [ "$(cat "book/$tag/.built_sha")" = "$TAG_SHA" ]; then
              echo "Skipping $tag (already built for this SHA)"
            else
              python3 "$SCRIPT_DIR/build_single_version_docs.py" "$tag" || true
              echo "$TAG_SHA" > "book/$tag/.built_sha"
            fi
            git checkout "$ORIGINAL_COMMIT" 2>/dev/null || git checkout "$ORIGINAL_BRANCH" 2>/dev/null || git checkout main 2>/dev/null
          done
          CURRENT_COMMIT=$(git rev-parse HEAD)
          [ "$CURRENT_COMMIT" != "$ORIGINAL_COMMIT" ] && git checkout "$ORIGINAL_COMMIT"
          rm -rf "$SCRIPT_DIR"
          python3 scripts/docs/rebuild_index.py

      # main as /dev/, built from its own worktree whatever this run checked out.
      - name: Build main as dev
        run: |
          git fetch --no-tags origin main
          git worktree add --detach "$RUNNER_TEMP/main" FETCH_HEAD
          rm -rf book/dev
          (cd "$RUNNER_TEMP/main" && DATUI_REPO_ROOT="$GITHUB_WORKSPACE" \
            python3 "$GITHUB_WORKSPACE/scripts/docs/build_single_version_docs.py" dev --worktree)
          git worktree remove --force "$RUNNER_TEMP/main"
          python3 scripts/docs/rebuild_index.py

      - name: Copy latest release to latest
        run: |
          LATEST_TAG=$(git tag -l "v*" | sort -V | tail -1)
          if [ -z "$LATEST_TAG" ]; then
            echo "::warning::No version tags found; skipping book/latest"
          else
            rm -rf book/latest
            cp -r "book/$LATEST_TAG" book/latest
            echo "Set book/latest -> $LATEST_TAG"
          fi

      - name: Prepare Pages artifact
        run: |
          cp -r book book-deploy
          find book-deploy -name .built_sha -delete

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./book-deploy

  deploy-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [build-docs]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
