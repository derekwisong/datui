name: Nightly

on:
  schedule:
    # Run daily at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free disk space (Ubuntu)
        # SHA-pinned to defend against upstream takeover; bump deliberately.
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - name: Run sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Install system dependencies
        run: |
          # The runner image ships third-party apt repositories datui does not use (Chrome, for one).
          # When one of those serves a bad index, `apt-get update` exits non-zero and fails a build
          # that had nothing to do with it. The install below is the real gate: if Ubuntu's own
          # indexes did not fetch, it fails there, for the right reason.
          sudo apt-get update || echo '::warning::apt-get update reported errors; continuing'
          sudo apt-get install -y pkg-config libfontconfig1-dev python3-dev

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'
          cache: 'pip'
          cache-dependency-path: |
            scripts/requirements.txt
            scripts/requirements-wheel.txt
            scripts/requirements-wheel-windows.txt
            python/pyproject.toml

      - name: Cache cargo dependencies
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: nightly
          cache-workspace-crates: true

      - name: Build release binary
        run: cargo build --release --locked --workspace -p datui

      - name: Verify release artifacts
        run: |
          test -f target/release/datui || (echo "Release binary not found" && exit 1)
          test -f target/release/datui.1 || (echo "Manpage not found" && exit 1)

      - name: Cache cargo packaging tools
        id: cache-cargo-tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin
          key: ${{ runner.os }}-cargo-packaging-tools-v1
          restore-keys: |
            ${{ runner.os }}-cargo-packaging-tools-

      - name: Install cargo packaging tools
        run: |
          command -v cargo-deb || cargo install cargo-deb
          command -v cargo-generate-rpm || cargo install cargo-generate-rpm
          command -v cargo-aur || cargo install cargo-aur

      - name: Build deb package
        run: python3 scripts/packaging/build_package.py deb --no-build

      - name: Build rpm package
        run: python3 scripts/packaging/build_package.py rpm --no-build

      - name: Build AUR package
        run: python3 scripts/packaging/build_package.py aur --no-build

      - name: Bundle CLI for wheel
        run: |
          mkdir -p python/datui_bin
          cp target/release/datui python/datui_bin/
          chmod +x python/datui_bin/datui
          cp LICENSE python/LICENSE

      - name: Build Python wheel
        run: |
          pip install maturin
          cd python && maturin build --release --out dist

      - name: Upload packaging artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-linux
          path: |
            target/debian/*.deb
            target/generate-rpm/*.rpm
            target/cargo-aur/*.tar.gz
            target/cargo-aur/PKGBUILD
            python/dist/*.whl
            target/release/datui
            target/release/datui.1

  windows:
    runs-on: windows-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - name: Run sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'
          cache: 'pip'
          cache-dependency-path: |
            scripts/requirements.txt
            scripts/requirements-wheel.txt
            scripts/requirements-wheel-windows.txt
            python/pyproject.toml

      - name: Cache cargo dependencies
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: nightly
          cache-workspace-crates: true

      - name: Build release binary
        run: cargo build --release --locked -p datui

      - name: Bundle CLI for wheel
        run: |
          New-Item -ItemType Directory -Force -Path python/datui_bin
          Copy-Item target/release/datui.exe python/datui_bin/
          Copy-Item LICENSE python/LICENSE

      - name: Build Python wheel
        run: |
          pip install maturin
          cd python
          maturin build --release --out dist

      - name: Upload Windows wheel and binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-windows
          path: |
            python/dist/*.whl
            target/release/datui.exe

  # The test suite, on the platform that otherwise only sees it at release time.
  # CI's windows job is gated on the version not carrying -dev, so it runs on a
  # release commit and nowhere else: every test written during a cycle first
  # meets Windows when the release is already being cut. Three did that for
  # v0.3.2 and all three failed, none of them for a reason datui was at fault for.
  #
  # Its own job rather than steps after the release build, and in the dev
  # profile rather than release. Testing in release looked like it would reuse
  # the build above, but it did not: the release profile's thin LTO runs again
  # for every test executable, around twenty of them, and that alone took the
  # step to 70 minutes. A dev build of the same suite takes a few, runs in
  # parallel with the release build, and gets debug_assertions back.
  #
  # This is a copy of CI's windows job, cache key included. The shared key is
  # the point: CI's job runs too rarely to keep its own cache alive, so on a
  # release commit it has been building from cold. Nightly runs on main, whose
  # cache every branch can restore, so this job keeps that entry warm for it.
  # Keep the two in step; an env difference changes rust-cache's key and
  # silently splits the cache again.
  windows-tests:
    runs-on: windows-latest
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - name: Run sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'
          cache: 'pip'
          cache-dependency-path: |
            scripts/requirements.txt
            scripts/requirements-wheel.txt
            scripts/requirements-wheel-windows.txt
            python/pyproject.toml

      - name: Cache cargo dependencies
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci
          cache-workspace-crates: true

      - name: Create virtual environment and install requirements
        run: |
          python -m venv .venv
          .venv\Scripts\python.exe -m pip install --upgrade pip
          .venv\Scripts\pip.exe install -r scripts/requirements.txt
          .venv\Scripts\pip.exe install -r scripts/requirements-wheel-windows.txt

      - name: Generate sample data
        run: .venv\Scripts\python.exe scripts/generate_sample_data.py

      - name: Build
        run: cargo build --workspace --tests --locked

      - name: Run tests
        run: cargo test --workspace --locked --no-fail-fast

      - name: Bundle CLI for wheel
        run: |
          New-Item -ItemType Directory -Force -Path python/datui_bin
          Move-Item target/debug/datui.exe python/datui_bin/
          Copy-Item LICENSE python/LICENSE

      - name: Build and install Python package
        run: |
          .\.venv\Scripts\Activate.ps1
          cd python
          maturin develop

      - name: Run Python tests
        run: |
          .\.venv\Scripts\Activate.ps1
          pytest python/tests/ -v

  macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - name: Run sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'
          cache: 'pip'
          cache-dependency-path: |
            scripts/requirements.txt
            scripts/requirements-wheel.txt
            scripts/requirements-wheel-windows.txt
            python/pyproject.toml

      - name: Cache cargo dependencies
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: nightly
          key: ${{ matrix.target }}
          cache-workspace-crates: true

      - name: Build release binary
        run: cargo build --release --locked -p datui --target ${{ matrix.target }}

      - name: Get version
        id: version
        run: |
          VERSION=$(sed -n '/^\[package\]/,/^\[/p' Cargo.toml | grep -E '^\s*version\s*=' | head -1 | sed 's/.*"\([^"]*\)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Stage and pack tarball
        run: |
          TARGET="${{ matrix.target }}"
          VERSION="${{ steps.version.outputs.version }}"
          STAGING="datui-${VERSION}-${TARGET}"
          mkdir -p "$STAGING"
          cp LICENSE "$STAGING/"
          cp "target/${TARGET}/release/datui" "$STAGING/"
          cp "target/${TARGET}/release/datui.1" "$STAGING/"
          chmod +x "$STAGING/datui"
          tar czvf "datui-${VERSION}-${TARGET}.tar.gz" -C "$STAGING" .

      - name: Bundle CLI for wheel
        run: |
          mkdir -p python/datui_bin
          cp "target/${{ matrix.target }}/release/datui" python/datui_bin/
          chmod +x python/datui_bin/datui
          cp LICENSE python/LICENSE

      - name: Build Python wheel
        run: |
          pip install maturin
          cd python && maturin build --release --out dist --target ${{ matrix.target }}

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-macos-${{ matrix.target }}
          path: |
            datui-${{ steps.version.outputs.version }}-${{ matrix.target }}.tar.gz
            python/dist/*.whl
            target/${{ matrix.target }}/release/datui
            target/${{ matrix.target }}/release/datui.1

  # As on windows: CI's macos job only runs on a release commit, so this is the
  # one place the suite meets macOS during a cycle. Native arm64 only, as CI's
  # job is. Whatever is macOS-specific about a test -- /var resolving to
  # /private/var, for one -- is the same on x86_64.
  #
  # A copy of CI's macos job, dev profile and cache key included, for the
  # reasons spelled out on windows-tests. Release-profile tests took an hour
  # here too, nearly all of it LTO.
  macos-tests:
    runs-on: macos-latest
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - name: Run sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'
          cache: 'pip'
          cache-dependency-path: |
            scripts/requirements.txt
            scripts/requirements-wheel.txt
            scripts/requirements-wheel-windows.txt
            python/pyproject.toml

      - name: Cache cargo dependencies
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci
          cache-workspace-crates: true

      - name: Create virtual environment and install requirements
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -r scripts/requirements.txt
          .venv/bin/pip install -r scripts/requirements-wheel.txt

      - name: Generate sample data
        run: .venv/bin/python scripts/generate_sample_data.py

      - name: Build
        run: cargo build --workspace --tests --locked

      - name: Run tests
        run: cargo test --workspace --locked --no-fail-fast

      - name: Bundle CLI for wheel
        run: |
          mkdir -p python/datui_bin
          mv target/debug/datui python/datui_bin/
          chmod +x python/datui_bin/datui
          cp LICENSE python/LICENSE

      - name: Build and install Python package
        run: . .venv/bin/activate && cd python && maturin develop

      - name: Run Python tests
        run: . .venv/bin/activate && pytest python/tests/ -v

  # The fuzzers proper: each target gets a timed run that generates new input, rather
  # than the corpus replay CI does on every pull request. Targets run as a matrix so a
  # slow or failing one does not eat the others' budget, and `fail-fast: false` keeps a
  # crash in one from hiding results in the rest.
  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - parse_query
          - number_format
          - fuzzy_match
          - glob_match
          - config_parse
    env:
      # The deep configuration. AddressSanitizer can reach the unsafe code inside polars
      # and arrow that these targets feed, which the pull request job deliberately skips
      # because it doubles build size and slows execution. See scripts/code/fuzz.sh.
      DATUI_FUZZ_SANITIZER: address
      # Memory, not disk, is what limits this build. cargo-fuzz forces codegen-units=1, so
      # each crate is one sanitizer-instrumented LLVM module, and polars-core alone peaks at
      # 8.5 GB compiling that way. At the runner's default of four jobs it overlaps
      # polars-expr, polars-ops and arrow-cast (2-3.4 GB each), passes the 15 GB the runner
      # has, and the kernel takes out the runner service mid-compile: the job ends in "The
      # runner has received a shutdown signal" with nothing fuzzed. Two jobs keeps the worst
      # overlap near 12 GB, at the cost of a slower build.
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A sanitizer build of the polars dependency tree runs to roughly 12 GB of build
      # output, which does not fit alongside the runner image. The swap file stays: it is
      # the only headroom this job has if a compile goes past the estimate above.
      - name: Free disk space (Ubuntu)
        # SHA-pinned to defend against upstream takeover; bump deliberately.
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - name: Install system dependencies
        run: |
          sudo apt-get update || echo '::warning::apt-get update reported errors; continuing'
          sudo apt-get install -y pkg-config libfontconfig1-dev

      # Only ~/.cargo (registry and cargo-fuzz itself) is cached, not fuzz/target: a
      # sanitizer build is far too large for the Actions cache, and restoring it would
      # cost more than rebuilding.
      - name: Cache cargo dependencies
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: fuzz-asan
          workspaces: fuzz
          cache-targets: false

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      # Fuzzing is cumulative: the corpus is the set of inputs found to reach somewhere
      # new, and each one is a starting point the mutator builds on. Without this the
      # run would begin from the seed corpus in git every night and re-derive the same
      # shallow ground forever, so anything needing a chain of discoveries would stay
      # out of reach.
      #
      # A cache entry cannot be updated in place, so the key carries the run id to write
      # a fresh entry each night while restore-keys picks up the most recent previous
      # one. Restoring merges on top of the committed seeds rather than replacing them.
      # Restore and save are split rather than using the combined action, because the
      # combined one only writes its cache when the job succeeds. The night a target
      # actually crashes is the night its corpus is most worth keeping, and that is
      # exactly the night the job fails.
      - name: Restore accumulated corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-${{ matrix.target }}-

      # -max_total_time bounds the run; -rss_limit_mb catches a target that starts
      # allocating without bound, which is a finding in its own right. The corpus is
      # seeded from the repository and any new inputs are uploaded below, so a run that
      # finds new coverage is not thrown away. The matrix value reaches the script
      # through the environment rather than being interpolated into it, which is the
      # pattern zizmor wants for every expression that lands in a shell.
      - name: Fuzz
        env:
          FUZZ_TARGET: ${{ matrix.target }}
        run: |
          ./scripts/code/fuzz.sh run "$FUZZ_TARGET" "fuzz/corpus/$FUZZ_TARGET" \
            -- -max_total_time=600 -rss_limit_mb=4096

      # Before the corpus is cached, drop every input that no longer reaches anything
      # the rest does not. Without this it accumulates redundant entries night after
      # night until restoring it costs more than the fuzzing does. Runs even when
      # fuzzing failed, so a crash does not also throw away the night's corpus.
      - name: Minimise corpus
        if: always()
        env:
          FUZZ_TARGET: ${{ matrix.target }}
        run: ./scripts/code/fuzz.sh cmin "$FUZZ_TARGET"

      # A cache entry cannot be updated in place, so the key carries the run id to write
      # a fresh entry each night; the restore step's restore-keys picks up the most
      # recent previous one.
      - name: Save accumulated corpus
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}

      # Uploaded whether or not the run failed: on failure this carries the crashing
      # input needed to reproduce, and on success it carries any new corpus entries
      # worth committing.
      - name: Upload fuzz findings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-${{ matrix.target }}
          path: |
            fuzz/artifacts/
            fuzz/corpus/
          if-no-files-found: ignore
          retention-days: 14

  # datui-lib's optional features are not exercised by the ordinary build, which always
  # uses the default set, so a missing dependency in one of them stays invisible.
  # `dtype-decimal` reached the library only through `polars/sql` for a while, and every
  # build without that feature failed to compile without anyone noticing.
  #
  # Nightly rather than on pull requests: each combination is a fresh polars build, and
  # a regression here is a packaging problem rather than something that breaks a merge.
  features:
    name: Feature combinations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - name: Install system dependencies
        run: |
          sudo apt-get update || echo '::warning::apt-get update reported errors; continuing'
          sudo apt-get install -y pkg-config libfontconfig1-dev

      - name: Cache cargo dependencies
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: features

      # Every feature alone and none at all. The full powerset would be sixteen polars
      # builds to catch interactions that have never actually broken; each feature on its
      # own is where the missing dependencies show up.
      - name: Check each feature in isolation
        run: |
          set -euo pipefail
          failed=0
          for f in "" cloud http sql streaming; do
            echo "::group::datui-lib [${f:-no features}]"
            if [ -z "$f" ]; then
              cargo check -p datui-lib --no-default-features || failed=1
            else
              cargo check -p datui-lib --no-default-features --features "$f" || failed=1
            fi
            echo "::endgroup::"
          done
          cargo check --no-default-features || failed=1
          exit $failed

      # A check compiles the configuration; it does not run it. The `(all files)` row
      # was behind `feature = "cloud"` long after it stopped being a cloud row, so a
      # build without the feature had no second door at all — and every test that says
      # otherwise passed, because none of them ran in that configuration.
      - name: Test without default features
        run: cargo test --no-default-features
